# 정적 배포 — GitHub Pages
#
# 계산이 전부 브라우저에서 돈다. 서버가 없으므로 **정적 호스팅만으로 동작한다**:
# PC가 꺼져 있어도 아이패드에서 열리고, 같은 네트워크에 있을 필요도 없다.
#
# **base 경로**: Pages는 `https://<user>.github.io/<repo>/`처럼 하위 경로에 올라간다.
# 빌드가 **상대 경로**(`base: "./"`)를 쓰므로 하위 경로든 루트든 그대로 열린다 —
# 리포지토리 이름을 workflow에 박지 않는다(이름이 바뀌어도 안 깨진다).
#
# ────────────────────────────────────────────────────────────────────────────
# **2026-08-21: 배포 대상을 `web/` → `web2/`로 옮겼다.**
#
# `web2/`가 지시서의 1~7단계를 전부 담고 검증(단위 75건 · 종단 흐름 dpr1/2 ·
# 정적 배포·전환 e2e)을 통과했다. 근거와 시점은 `web2/NOTES.md`의 「배포 전환」.
#
# ⚠ **`web/`은 지우지 않는다** — 저장소와 이력에 그대로 있다. 다만 **배포되지 않고**,
# 그 측정 하네스도 여기서 안 돈다(배포와 무관해졌다. 필요하면 로컬에서 돌린다).
#
# ⚠ **같은 주소에 다른 앱이 온다.** 옛 배포의 서비스 워커는 **문서까지 캐시 우선**이라
# 그대로 두면 열린 창이 옛 앱에 묶인다. web2의 워커가 활성화될 때 **제 것이 아닌 캐시를
# 전부 지우고** 옛 문서를 띄운 창을 다시 부른다. 그 인계를 `e2e/static_deploy.spec.ts`가
# **옛 워커를 실제로 깔아 놓고** 잰다(양성 채널 포함) — 이 job이 그것을 돌린다.
name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 배포에 필요한 것만 ───────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web2/package-lock.json
      - run: npm ci
      # 타입 — 배포본이 컴파일되는가
      - run: npm run typecheck
      # 계산 — 소실점·카메라·좌표·오스냅·재료. 몇 초면 돈다(외부 데이터 의존 없음)
      - run: npm test
      - run: npm run build
      # **초록 실행**(web2-54 §1㉢) — 종전에는 `static_deploy.spec.ts` 하나만 돌았고
      # `ui34 ④`가 34-3부터 빨간 채 배포돼 아무 회차도 못 봤다(#89의 사고). 이제 매 푸시가
      # e2e:green(병렬 4 · 계측 넷 제외 · dpr2는 픽셀 목록만 — e2e/dpr2list.ts)을 돈다.
      # 「초록」이 초록이 되는 것이 이 절의 목적이다. 전량(dpr2 전부·계측 포함)은
      # e2e:night — 사람이 도는 세션·마감의 몫이다.
      # ⚠ static_deploy.spec(하위 경로·워커 scope·옛 배포 인계·`?reset`)도 green 안에서
      # 돈다 — `dist/`가 있어야 하므로 위 `npm run build` 다음에 둔 이유는 그대로다.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:green
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
