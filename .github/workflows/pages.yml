# 정적 배포 — GitHub Pages (L-D.2)
#
# 계산이 전부 브라우저에서 돈다. 서버가 없으므로 **정적 호스팅만으로 동작한다**:
# PC가 꺼져 있어도 아이패드에서 열리고, 같은 네트워크에 있을 필요도 없다.
#
# **base 경로**: Pages는 `https://<user>.github.io/<repo>/`처럼 하위 경로에 올라간다.
# 빌드가 **상대 경로**(`base: "./"`)를 쓰므로 하위 경로든 루트든 그대로 열린다 —
# 리포지토리 이름을 workflow에 박지 않는다(이름이 바뀌어도 안 깨진다).
#
# **서비스 워커**: `sw.js`도 상대 경로로 등록하므로 scope가 그 하위 경로가 된다.
# 빌드가 사전 캐시 목록을 주입한다(`vite.config.ts`의 `swPrecache`).
#
# ────────────────────────────────────────────────────────────────────────────
# **측정과 배포를 가른다**(2026-08-16, CI 실패로 배웠다)
#
# 첫 판은 `npx vitest run`을 통째로 돌렸고 **Pages 배포가 막혔다** —
# `one_stroke_one_axis`·`bend_share`가 `data/quickdraw/*.ndjson`을 읽는데
# 그 파일은 `.gitignore`에 있어 CI에 **없다**(Google CC BY 4.0 데이터라 복제 안 한다).
#
# 그 둘은 **로컬 전용 측정 하네스**이고 배포와 무관하다. 그래서:
#   · 배포 경로는 **배포에 필요한 것만** 돌린다 — 타입 · 빌드 · **정적 배포 확인**.
#   · 측정 하네스는 별도 job(`measure`)에서 돌고 **배포를 막지 않는다**(`continue-on-error`).
#   · 데이터가 없으면 그 둘은 **건너뛴다**(`test/dataDeps.ts`) — ⚠ **통과로 세지 않는다**.
#     vitest가 skip으로 보고하고 사유가 이름에 뜬다(PITFALLS #32).
#     로컬·야간은 `S2S_REQUIRE_DATA=1`로 돌려 **건너뛰기를 실패로 바꾼다.**
#
# ⚠ **배포 job이 여전히 테스트를 돈다.** "빠르게 하려고 뺀다"가 아니라
# **배포와 무관한 것을 뺀다**가 기준이다 — A-4(깨진 채로 다음으로 가지 않는다)는 그대로다.
name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 배포에 필요한 것만 ───────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 타입 — 배포본이 컴파일되는가
      - run: npx tsc --noEmit
      - run: npm run build
      # **정적 배포 확인**(L-D.2) — 하위 경로에서 열리는가 · 서비스 워커 scope ·
      # 오프라인 새로고침 · 그 확인의 양성 채널. **이것이 배포와 직접 관련된 유일한 e2e다.**
      # ⚠ `dist/`가 있어야 돈다 — 위 `npm run build` 다음에 둔 이유다.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/static_deploy.spec.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── 측정 하네스 — **배포를 막지 않는다** ─────────────────────────────────
  #
  # 단위·측정 테스트 전체를 돌린다. 외부 데이터가 필요한 둘은 **건너뛴다**(위 머리말).
  # `continue-on-error`인 이유: 측정 실패는 **배포 가능성과 무관**하고,
  # 여기서 막으면 문서 한 줄 고치는 push마다 배포가 멎는다.
  # ⚠ **그래도 빨간 X는 뜬다** — 요약에서 보이므로 "조용히 지나가는 것"이 아니다.
  measure:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # **어느 것이 건너뛰어졌는지 요약에 남긴다** — 건너뛰기가 조용하면 #32다
      - name: 건너뛴 측정 요약
        if: always()
        run: |
          {
            echo "### 외부 데이터가 없어 건너뛴 측정"
            echo ""
            echo "CI에는 \`data/quickdraw\`·\`sessions/\`가 없다(둘 다 저장소에 안 담는다)."
            echo "그 하네스는 **건너뛰었고 통과로 세지 않았다** — 위 vitest 요약의 \`skipped\`가 그것이다."
            echo "등록처는 \`web/test/dataDeps.ts\`이고, 로컬에서 \`S2S_REQUIRE_DATA=1\`로 돌리면"
            echo "**건너뛰기가 실패로 바뀐다.**"
          } >> "$GITHUB_STEP_SUMMARY"
