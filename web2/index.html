<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!-- 설치 표시줄 색 — 매니페스트 theme_color와 같은 값(#f5f3ee = --paper) -->
  <meta name="theme-color" content="#f5f3ee" />
  <!-- iOS 보험(web2-09 지시 1) — iOS 16.4 미만은 매니페스트 display를 안 읽는다.
       ⚠ 실기기가 안드로이드(MovinkPad)라 iOS는 **확인 못 했다** — 선언만 실었다. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Brunelleschi</title>
  <!-- 매니페스트·아이콘은 web2의 것이다(web2-08이 교체, web2-09 지시 0이 커밋).
       start_url `./`와 주소는 옛 앱(web/) 때 그대로라 설치된 PWA가 이 화면으로 들어온다. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    /* ── 그리기 도구의 UI (지시 4) ───────────────────────────────────────
       박스도 테두리도 없다. 요소만 둔다(4-a). 색은 회색조 하나이고 강조는 안 쓴다 —
       선택은 색이 아니라 **위치와 크기**로 보인다(4-d, 프로크리에이트 선례).
       그림이 주인공이므로 UI는 물러난다(4-c). */
    :root {
      --paper: #f5f3ee;
      --ui: #8d8880;        /* 안 고른 도구 — 물러나 있다 */
      --ui-faint: #b8b3ab;
      /* ── 세로바 크기의 단일 출처(web2-12 3번) ─────────────────────────────
         web2-10이 1.5배로 키울 때 값이 svg 속성마다 흩어져 시점·치수 버튼(20px)이
         빠졌다 — 배수는 여기 하나다. 아이콘 크기는 기준 높이 × 이 배수(아래 .ico-*).
         누름 여유(--hit-pad 3px)는 보이는 크기를 안 바꾸고 닿는 넓이만 키운다(관측 ②).
         ⚠ 두 «간격»을 가른다(2차 리뷰어 [6]의 혼동 자리): --btn-gap(1px)은 **버튼 사이
         flex gap**이고(종전 9px의 자리 — 시각 간격은 gap+2×pad=7px로 종전과 같은 대역),
         .bar-gap(10px)은 **그룹 사이 여백**이다(종전 21px → 10px). 줄인 대가는 높이
         예산이다: 요소가 늘어(시점 묶음 편입·연필통) 800px 화면에 들어가야 했다 —
         «간격을 늘린다» 선택지(지시 3)는 겹침이 0이라 발화 조건이 없었다(겹침은 흐름
         배치의 구성 보장 — 늘릴 이유는 겹침이지 여백이 아니다).
         겹침 0은 흐름 배치가 구성으로 보장한다(패딩은 흐름 안이다) — 선택 확대는
         svg에만 걸어(아래 .tool.on svg) 누름 상자를 안 건드린다. e2e sidebar.spec가
         크기 대역·오른쪽 정렬·쌍별 겹침 0을 잰다. */
      --ui-scale: 1.5;
      --hit-pad: 3px;
      --btn-gap: 1px;
      /* ── 치수 리본의 «기둥»과 위 띠의 «길»(web2-34 6번 · 화면 규칙 R5) ────────────
         `#dimpanel`은 우측에 **세로로 긴 기둥**이다(실측 x 872..1104 · y 96..669 —
         높이 573px라 아래로 못 비킨다). 위 띠에서 내려오는 것(표시 팝업 · 파일·설정
         서랍)이 그 기둥을 가로지르면 **동시에 열릴 수 있는 둘이 같은 자리를 쓴다**(#79).
         ⚠⚠ **이 다툼은 34-6이 만든 것이 아니라 이미 있었다**: `#display-pop`(x 753..1030 ·
         y 48..199)이 기둥과 x 872..1030 · y 96..199에서 겹쳤고, 둘 다 z 11이라 **DOM에서
         뒤인 치수 리본이 위로 그려졌다** — 치수 리본을 편 채 「표시」를 누르면 팝업이
         **리본 뒤로 깔린다.** 34-6이 서랍을 위로 올리면서 그 자리가 드러났다.
         답은 z가 아니라 **자리를 나누는 것**이다(#79의 문면) — 위 띠에서 내려오는 것은
         기둥의 **왼쪽 길**에 선다. 값은 기둥에서 계산한다(단일 출처 — #54). */
      --dim-right: 96px;             /* 치수 리본의 오른쪽 여백 */
      --dim-w: 232px;                /* 그 폭(내용 208 + 좌우 패딩 12) */
      --top-lane: calc(var(--dim-right) + var(--dim-w) + 6px);   /* = 334px */
      /* 종이 띠가 멈추는 자리 — **위 띠의 왼쪽 끝**보다 앞이어야 한다(170 + 156 + 여유 14) */
      --topbar-reserve: 340px;
    }
    /* touch-action을 **뿌리에도** 건다(web2-09 지시 2). 모든 요소가 #app의 자손이라
       유효 사슬에는 이미 none이 들어 있지만, 그 한 겹이 규칙 하나에 걸려 있었다 —
       뿌리 겹은 #app 쪽이 지워져도 브라우저 핀치·이중 탭 확대를 막는다.
       ⚠ 실기기 증상(핀치가 브라우저 줌)은 헤드리스에서 재현이 안 됐다 — 선언 두 겹을
       다 벗겨도 합성 핀치가 줌을 못 낸다(계측기 한계). 남는 후보는 선언을 설계상
       이기는 축(안드로이드 접근성 「강제 확대」·비-크롬 브라우저)이고 실기기에서 가른다. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); touch-action: none; }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { position: absolute; inset: 0; display: block; }
    #ink { z-index: 2; }
    #gl { z-index: 1; }
    /* 바탕 종이의 결(web2-30 9번) — **맨 아래**. 이 판이 곧 종이라 아무것도 안 가리고,
       그래서 곱과 보통 그리기가 같은 결과다(#film의 재조립이 필요 없는 이유).
       종전에는 종이가 `body { background: var(--paper) }` 한 줄이라 결이 아예 없었다. */
    #paperfilm { z-index: 0; pointer-events: none; }
    /* brush 렌더러(web2-11 2부) — gl 위·ink 아래. 입력은 ink가 받으므로 이 겹은 눌리지 않는다. */
    #brushc { z-index: 1; pointer-events: none; }
    /* ── ⛔ **web2-48 48-1의 곱 합성은 되돌렸다** — 그리고 그 이유가 여기 산다 ──
       **진단은 그대로 서 있다**(D-1 · AS-C158): p5.brush는 «흰 종이 위»를 전제로
         bgColor = mix(vec3(1.0), source.rgb, source.a);  outColor = vec4(..., 1.);
       로 짜여 있어 **닿은 픽셀을 전부 불투명하게** 쓴다 — 마커 한 획의 상자에서
       칠한 픽셀 1360개가 전부 알파 255이고 948개가 종이보다 밝다. 그것이 「칠이 하얀게
       뜼다」의 기제다. 곱은 그 장막을 실제로 지우기도 했다(종이보다 밝은 픽셀 918 → 0).
       **그런데 이 겹은 «종이 위의 잉크»가 아니다.** 승격된 획은 **몸체가 #gl의
       Line2**이고 #brushc에는 **그 위에 얹히는 재료 질감**만 산다(web2-11 2부). 그래서
       이 겹을 통짜로 곱하면 **질감 × 몸체 = 잉크가 두 번 어두워진다**.
       실측(`press26.spec` ② · dpr2 · p=0.20): 꺼짐 **185.3 → 128.9** · 켬 **196.0 → 127.1**
       — 흑연이 **~30% 어두워졌고** «보정을 켜면 약한 획이 옆다»가 **뒤집혔다**(켬 < 꺼짐).
       그것은 흰 장막보다 큰 손해다 — 그려진 그림 전부가 바뀐다.
       ⚠⚠ **그래서 되돌린 것은 «곱이 안 선다»가 아니라 «이 겹이 곱의 대상이 아니다»이다**
       (AS-C157은 그대로 서 있다 — #73 ㉐은 여전히 이 겹에 안 걸린다: 곱은 **발화한다**).
       올바른 수리는 **칠에게 제 겹을 주는 것**이고 그것은 한 회차짜리다 — `DEFERRED.md`.
       지금 화면은 45·46과 같다(무회귀). 다만 **48-9가 증상을 줄였다**: 칠한 면이 종이색
       불투명이라 장막이 «회색 면 위의 흰 반점»에서 «종이 위의 흰 반점»으로 낮아졌다. */
    /* 막(web2-20 3부) — 곱은 **캔버스 안에서** 한다(filmlayer.ts drawFilms 머리주석 —
       CSS mix-blend-mode는 이 앱의 합성 트리(WebGL 형제 겹)에서 발화하지 않았다: 실측).
       #film은 막 영역의 «물든 아래 화면» 사본이라 보통 합성으로 얹는다.
       #layerc = 활성 겹과 그 위 획(막 위에 산다 — 3-b). */
    #film { z-index: 1; pointer-events: none; }
    #layerc { z-index: 1; pointer-events: none; }

    /* ── 종이 탭 띠(web2-19 2부) — 위 왼쪽. 탭이 **종이의 가장자리**다(대응표 §6) ──
       #topleft는 세로 기둥 — 높이를 하드코딩하지 않는다(web2-20이 아래에 종속 탭 줄을
       붙인다 — 회귀 ⑦이 실제로 줄을 붙여 잰다). 얇게: 띠 높이는 내용(글자+패딩)이 정하고
       초안 대역은 28px이다(#12 — 눈으로 골랐다, assumptions AS-C62). */
    #topleft {
      position: fixed; top: 0; left: 0; z-index: 9;
      display: flex; flex-direction: column; align-items: flex-start;
      /* 오른쪽의 **위 띠**보다 먼저 멈춘다 — 종이가 많으면 띠 안에서 가로 스크롤로
         넘긴다(#paperbar overflow-x). 20장 팔이 이 경계를 실제로 민다.
         ⚠⚠ **web2-34 6번이 이 수를 깨뜨렸다**: 위 띠에 구분선 + 서랍 둘이 들어와
         폭이 **112 → 156**으로 늘었고(왼쪽 끝 918 → **874**), 예약 300px(= 왼쪽 끝 900)이
         모자라 **탭 띠가 위 띠를 파고들었다** — 전량 e2e가 잡았다(`paperbar.spec ③④⑤⑥`에서
         「+」가 안 눌린다: `#eyebar` 자손이 포인터를 가로챈다). 예약은 **띠의 오른쪽
         여백(170) + 폭(156) + 여유**로 잡는다. */
      max-width: calc(100vw - var(--topbar-reserve));
    }
    /* ── 썸네일 스트립(web2-25 3-b) — **늘 표시**(사람이 정했다). 시점은 이름이 아니라
       **그림으로 알아본다**(선례: Procreate 레이어 목록이 썸네일을 맨 앞에 둔다).
       띠 높이가 28 → **49px**로 는다(AS-C89 — 썸네일 26+테두리 2 · 이름 11 · 패딩 4/3 ·
       사이 2 · 아래 테두리 1. 지시의 45~50px 대역 안이다). */
    #paperbar { display: flex; flex-direction: row; align-items: flex-end; gap: 1px; overflow-x: auto; max-width: 100%; }
    .ptab {
      background: rgba(252,251,248,.55); border: 0; border-radius: 0 0 0 0;
      font: 11px/1 system-ui, sans-serif; color: var(--ui);
      padding: 4px 6px 3px; margin: 0; cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent; touch-action: none;
      border-bottom: 1px solid var(--ui-faint);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    /* 썸네일 칸 — 높이 고정·너비는 화면 비가 정한다. 그림이 없으면 같은 크기의 빈 종이. */
    .ptab .pthumb {
      height: 26px; width: 39px; display: block; object-fit: cover;
      background: var(--paper); border: 1px solid var(--ui-faint);
    }
    .ptab .pname { display: block; max-width: 72px; overflow: hidden; text-overflow: ellipsis; }
    /* 활성 = 맨 위 종이 — 색이 아니라 **형태**가 가른다(규칙 둘). 아래 테두리가 사라져
       종이와 한 장으로 붙고, 썸네일 테두리가 진해져 **앞으로 나온다**. */
    .ptab.on { background: var(--paper); color: #55504a; border-bottom-color: transparent; }
    .ptab.on .pthumb { border-color: var(--ui); box-shadow: 0 1px 6px rgba(0,0,0,.10); }
    #paper-add {
      border-bottom-color: transparent; background: none;
      flex-direction: row; align-self: stretch; padding: 0 10px;
    }
    /* ── 셔터의 번쩍임(web2-25 3-a) — **짧고 무채색**이다(순간 피드백 대역 · 색 ⛔).
       화면 전체를 덮고 스스로 사라진다. 시간은 AS-C90(C.SHUTTER_FLASH_MS와 한 값). */
    #shutter-flash {
      position: fixed; inset: 0; z-index: 40; pointer-events: none;
      background: #fff; opacity: .55;
      animation: shutterfade var(--shutter-ms, 120ms) linear forwards;
    }
    @keyframes shutterfade { from { opacity: .55 } to { opacity: 0 } }
    .ptab-edit {
      font: 12px/1 system-ui, sans-serif; color: #55504a; background: none;
      border: 0; border-bottom: 1px solid var(--ui); outline: none; width: 72px; padding: 0;
    }
    /* 길게 누르면 뜨는 것 — 썸네일·이름·삭제(작도 종이는 삭제 없음) */
    #paper-pop {
      position: fixed; z-index: 11;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 8px 10px; font: 12px/1.5 system-ui, sans-serif; color: #6b665f;
    }
    #paper-pop img { width: 160px; height: auto; display: block; }
    #paper-pop u, .paper-confirm u { cursor: pointer; }
    #paper-pop u.blocked { cursor: default; text-decoration: none; opacity: .5; }
    /* ── 겹 — **접으면 요약, 펼치면 목록**(web2-25 4-a · 연필통과 같은 어법) ──────────
       옛 형태(겹쳐 놓은 탭 더미)는 34×28 안에 눈·자물쇠를 우겨넣어 «쓰기 불편»했다
       (사람의 문면). 가산적임은 이제 **요약의 수**가 말한다 — 종이는 탭이 여럿(배타적),
       겹은 하나에 수가 붙는다. 목록의 줄은 **넓다**(Procreate 레이어 행의 이유). */
    #layerbar { position: relative; display: flex; flex-direction: row; align-items: center; gap: 4px; padding: 2px 0 0 8px; }
    .lsum {
      display: flex; align-items: center; gap: 3px;
      font: 11px/1 system-ui, sans-serif; color: var(--ui);
      background: rgba(252,251,248,.82); border: 1px solid var(--ui-faint);
      padding: 3px 7px 3px 4px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .lsum svg { width: 20px; height: 20px; }
    .lsum-n { font-variant-numeric: tabular-nums; }
    .lsum.open { color: #55504a; box-shadow: 0 1px 6px rgba(0,0,0,.10); }
    /* 솔로인 동안은 **요약이 그것을 말한다** — 목록을 접어도 「지금 하나만 보고 있다」가 남는다 */
    .lsum.solo { border-style: dashed; }
    #layer-list {
      position: absolute; top: 100%; left: 8px; z-index: 11; margin-top: 3px;
      display: flex; flex-direction: column;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      /* ⚠ **몸통이 줄의 가운데를 차지해야 한다**(web2-25 4-a): 좁으면 눈·자물쇠가 가운데로
         밀려 «줄을 눌렀는데 눈이 눌린다»가 난다. 초판 148px에서 실제로 그랬고 전량 e2e가
         잡았다(paper.spec·cost20.spec — 클릭이 활성 대신 켬/끔을 토글했다). */
      min-width: 200px;
    }
    .lrow {
      display: flex; align-items: center; gap: 8px;
      min-height: 34px; padding: 2px 8px;          /* 넓은 줄 — 손가락이 정확히 안 가도 된다 */
      font: 11px/1 system-ui, sans-serif; color: var(--ui);
      cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .lrow + .lrow { border-top: 1px solid var(--ui-faint); }
    .lrow .lrow-icon svg { width: 20px; height: 20px; display: block; }
    .lrow-n { flex: 1; font-variant-numeric: tabular-nums; }
    .lrow.active { background: rgba(0,0,0,.045); color: #55504a; }
    .lrow:not(.on) { opacity: .45; }              /* 꺼짐 — 젖혀 둔 종이 */
    .lrow.solo { box-shadow: inset 2px 0 0 var(--ui); }
    .ltab.ladd {
      display: flex; align-items: center; background: none; border: 0; color: var(--ui);
      padding: 4px 5px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .ltab.ladd.disabled { opacity: .3; cursor: default; }
    .ldel { font: 13px/1 system-ui, sans-serif; }
    /* 롤 버튼(web2-21 3-a) — 카메라 닫히기 전 비활성. 클릭은 살아 있다(이유를 말해야 한다 — 2-a) */
    #btn-roll.disabled { opacity: .3; }
    /* ⚠ web2-48 48-4 — `#btn-grip`은 `disabled`를 **달고 있었는데 그려지지 않았다**
       (main.ts가 classList를 토글하는데 `.t.disabled` 규칙이 없었다). 그래서 «잡은 것이
       없다»가 화면에 한 톨도 안 나왔고, 통을 열어 «흐린 줄 여덟»을 보고나서야 알 수 있었다.
       값은 롤 버튼과 같게 둔다(새 수 ⛔ — 같은 뜻은 같은 표현, #54). */
    .t.disabled { opacity: .3; }
    .lctl { background: none; border: 0; padding: 2px; margin: 0; cursor: pointer; color: inherit; opacity: .75; }
    .lctl:hover { opacity: 1; }
    #layer-pop {
      position: fixed; z-index: 11;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 8px 10px; font: 12px/1.5 system-ui, sans-serif; color: #6b665f;
    }
    #layer-pop u { cursor: pointer; }
    .lpick { display: flex; align-items: center; gap: 6px; background: none; border: 0;
      padding: 3px 4px; cursor: pointer; color: var(--ui); font: 12px system-ui, sans-serif; }
    .lpick svg { width: 22px; height: 22px; }
    .lpick:hover { color: #55504a; }

    /* ── 위 띠(web2-34 6번) — 위 오른쪽. 뷰 큐브(cx W−110·y 20~100)와 안 겹치게 왼쪽에.
       ⚠⚠ **id는 `#eyebar` 그대로다**(배선·팔 여럿이 그 이름을 읽는다 — #54) — 바뀐 것은
       **무엇이 사는가**이고 이름이 아니다. web2-19 3-a는 이 자리를 「눈」(이 종이를 어떻게
       보는가)으로 세웠는데, 34-6이 가르는 축은 그것이 아니라 **「그리는 중에 쓰는가」**다:
         그리는 중에 쓴다   → 손 띠(세로바). **시점 조작도 여기다** — 그리면서 계속 쓴다
         그리는 중에 안 쓴다 → 이 띠. 파일 · 설정 · 내보내기
       그래서 ㉠ 「작도 시점으로」가 **손 띠로 내려갔고** ㉡ 파일·설정 서랍이 **여기로 올라왔다.**
       ㉡가 우하단의 자리 다툼(R5 · #79)도 같이 끝낸다 — 서랍이 빌드 식별자·진단 패널·
       자립 깃발과 같은 모서리를 쓰다가 **두 번을 z로 풀고 있었다**(서랍 11→13 · 깃발 12→9). */
    #eyebar {
      position: fixed; top: 12px; right: 170px; z-index: 9;
      display: flex; flex-direction: row; gap: var(--btn-gap); align-items: flex-start;
    }
    /* 두 묶음을 가르는 채널 — 세로바의 `.bar-divider`와 같은 뜻이고 방향만 세로다(3-c) */
    .top-divider { width: 1px; height: 30px; background: var(--ui-faint); margin: 3px 5px; opacity: .55; align-self: center; }
    /* 표시·자 팝업 — 설정 자루의 옅은 바탕 규약 그대로(4-a: 「배경이 필요하면 아주 옅게」) */
    #display-pop, #snap-pop, #face-pop, #lens-pop {
      position: fixed; z-index: 11;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; white-space: nowrap;
      font: 12px/1.5 system-ui, sans-serif; color: #6b665f;
    }
    #display-pop[hidden], #snap-pop[hidden], #face-pop[hidden], #lens-pop[hidden] { display: none; }
    #display-pop { top: 48px; right: var(--top-lane); }   /* 위 띠의 길(R5) — 치수 기둥의 왼쪽 */
    /* 팝업의 둘째 열(웹2-19의 «오른쪽 54px» 규약) — **web2-44 띠 재편이 100px로 옮겼다**:
       짝 줄([자|손통] 91px)이 세로바를 왼쪽으로 키워, 54px 자리의 팝업이 **자기를 연
       단추(자)를 덮었다** — 열린 채로 그 단추를 다시 눌러 닫는 길이 막혔다(zones.spec ②가
       실측: snap-pop subtree intercepts pointer events). 100 = 줄 폭 91 + 여백. */
    #snap-pop { right: 100px; }
    #face-pop { right: 100px; }
    #lens-pop { right: 100px; }
    .lens-reset { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--ui); font: 12px system-ui, sans-serif; text-align: left; text-decoration: underline; opacity: .75; }
    .lens-reset:hover { opacity: 1; }
    #btn-lens[disabled] { opacity: .3; cursor: default; }
    /* 축 스냅 자리(3-b) — 컨트롤이 없다: 끄는 토글은 이 회차에 없다(대응표 §4 — 자리만) */
    #axis-snap-slot { color: var(--ui-faint); }
    /* 되돌리기와 도구를 가르는 선(3-a) — 공백이 아니라 채널이다(3-c) */
    .bar-divider { width: 30px; height: 1px; background: var(--ui-faint); margin: 2px 1px; opacity: .55; }
    /* 자(삼각자) — 정사각 viewBox(32×32)라 지우개 급(ico-h 48px)이면 폭이 48이 된다.
       손 띠 폭 규약(39px — ①')에 맞는 전용 급: 높이 = 26px × 배수 = 39. */
    .ico-sq svg { height: calc(26px * var(--ui-scale)); width: auto; }
    /* ── 전체 화면(3-d) — 크롬을 전부 숨긴다: 종이 띠·눈·손·서랍·치수 리본.
       지평선·소실점 ✕·바닥 눈금은 캔버스 몫이라 그대로 남는다(작도의 뼈대).
       ⚠ web2-34 3번에 **굵기 막대(#thick)가 사라졌다** — 지우개 크기는 이제 통이고,
       ⚠⚠ **통 넷은 이제 세로바 «밖»이다**(34-6 후속 — 쌓임 맥락에서 꺼냈다) — 그래서
       이 목록에 **따로 적는다**. 종전에는 `#sidebar` 한 줄이 같이 덮고 있었다.
       ⚠ web2-34 6번으로 **파일·설정 서랍이 위 띠(#eyebar) 안으로 올라왔다** — 그 줄도
       #eyebar 하나가 덮는다(옛 자리는 세로바 안이었다). */
    body.fs #topleft, body.fs #eyebar, body.fs #sidebar,
    /* ⚠ web2-48 48-4 — `#griptray`·`#painttray`가 **이 목록에서 빠져 있었다**(44·46이
       더하면서 안 적었다) — 전체화면에서 그 둘만 떠 있었다.
       「규칙을 세워도 새로 추가되는 것에는 안 쓸린다」의 또 한 사례다(48-10이 그것을 규칙으로 박았다). */
    body.fs #tray, body.fs #pentray, body.fs #etray, body.fs #rolltray,
    body.fs #griptray, body.fs #painttray,
    body.fs #dimpanel, body.fs #display-pop, body.fs #snap-pop, body.fs #layer-pop, body.fs #face-pop,
    body.fs #lens-pop { display: none; }
    #fs-exit {
      display: none; position: fixed; right: 6px; bottom: 34px; z-index: 12;
      background: none; border: 0; padding: var(--hit-pad); cursor: pointer;
      color: var(--ui); opacity: .5;
    }
    #fs-exit:hover { opacity: .9; }
    body.fs #fs-exit { display: block; }
    /* 자립 깃발(3-a) — 진단 패널이 펴져 있을 때만 곁에 보인다(diagpanel.ts의 render가
       panel 안을 다시 쓰므로 **패널 밖 형제**가 유일하게 살아남는 자리다). 패널은 판독
       전용(pointer-events:none)이고 이 줄만 조작이다 — 패널을 위로 밀고 그 아래 선다. */
    #diagctl { display: none; }
    #devmenu #diagctl { display: block; }   /* web2-69 — 개발 메뉴 안에서만 산다 */
    /* ⚠⚠ **z-index 9**(web2-30 3번 별건) — 세로바(z 10)보다 **아래**다.
       30-10이 진단의 여닫이를 설정 패널(#pane-settings — 세로바 안)로 옮기면서 셋이 전부
       우하단에 모였고, 이 줄이 12이던 초판에서는 **열린 자립 깃발이 「진단」 단추를 삼켰다**
       (전량 e2e가 잡았다 — `#diagctl` intercepts pointer events).
       ⚠ 세로바는 **자기 쌓임 맥락**이라(fixed + z-index) 그 «안»의 z를 올려도 밖과 못
       겨룬다 — 서랍 패널을 13으로 올려도 소용없었다. 그래서 **판독 표시 쪽을 내린다**:
       세로바를 올리면 «알림이 리본 위»(web2-20 2-c)까지 뒤집히므로 그쪽은 안 건드린다. */
    #diagpanel:not([hidden]) + #diagctl {
      display: block; position: fixed; z-index: 9;
      font: 11px/1.6 monospace; color: #6b665f;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 4px 10px; right: 6px; bottom: 26px;
    }
    #diagpanel:not([hidden]) { bottom: 56px; }

    /* 알림 — 최상단 한 줄. 박스 없음. **오류가 있을 때만 뜬다**(4-b). 선택은 밑줄 단어. */
    /* 제안(web2-29 2단계)은 **web2-32 2번이 걷어냈다** — 즉시 치수선이 되고 사후에
       고친다. 오른쪽 위의 그 줄(#dimsuggest)과 그 CSS는 여기서 사라졌다. */
    /* 툴팁(web2-28 2번) — 화면의 다른 것과 같은 결(옅은 바탕·테두리 하나). */
    #tip {
      position: fixed; z-index: 60; pointer-events: none;
      background: #faf8f3; color: #3c3831; border: 1px solid #d8d2c6;
      padding: 3px 7px; font-size: 12px; line-height: 1.35; max-width: 240px;
      box-shadow: 0 1px 3px rgba(0,0,0,.10);
    }
    #tip[hidden] { display: none; }
    body.fs #tip { display: none; }
    #notice {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      font: 13px/1.8 system-ui, sans-serif; text-align: center;
      color: #6b665f; pointer-events: none; height: 24px;
    }
    #notice u { pointer-events: auto; cursor: pointer; }

    /* 시점 묶음(홈·시점 저장·명명된 뷰·치수) — **세로바 안으로 들어왔다**(web2-12 3번).
       web2-10이 겹침을 피하려 둘째 열(right:54)로 뺐던 것이 「크기가 안 맞고 오른쪽에
       정렬되지 않는다」는 관측을 낳았다 — 같은 흐름(flex) 안에 두면 겹침은 구성으로
       사라지고 오른쪽 세로축이 하나로 선다. */
    #viewbar { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }
    #views { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }

    /* 우측 세로바 하나 — 위: 시점·치수 · 실행취소 · 가운데: 도구·굵기 · 아래: 파일·설정(접힘).
       좌측과 하단은 비운다(4-i). */
    /* 크기의 단일 출처는 :root의 --ui-scale·--hit-pad·--bar-gap이다(web2-12 3번).
       ⚠ align-items는 **flex-end**다 — 폭이 다른 요소(도구 39px ↔ 아이콘 30px)가 섞이면
       중앙 정렬은 오른쪽 정렬이 아니다(관측 ①의 절반이 이것이었다). */
    /* 상단 고정(web2-12 3번) — 가운데 고정이던 초판은 요소가 늘며 **아래가 빌드 식별자
       (우하단 z-12 — 배포 판정자)를 덮었다**(e2e가 잡았다: 설정 요약 클릭을 가로챔).
       위에 붙이면 남는 여백이 전부 아래로 가 그 모서리가 비고, 화면이 커지면(실기기)
       더 여유롭다. */
    #sidebar {
      position: fixed; top: 12px; right: 2px;
      z-index: 10; display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end;
    }
    #sidebar-body { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }
    /* 띠 재편(web2-44) — **상자는 히트에서 뺀다**: 짝 줄이 상자를 왼쪽으로 키우면서
       투명한 컨테이너(#sidebar-body)가 뷰 큐브의 오른쪽 가장자리 히트를 삼켰다
       (turn31.spec 실측 — elementFromPoint가 'sidebar-body'를 냈다). 닿는 것은 버튼이지
       상자가 아니다 — 버튼 사이·왼쪽의 빈 자리는 캔버스(큐브·그림)로 지나간다. */
    #sidebar, #sidebar-body, #sidebar-body .bar-row { pointer-events: none; }
    #sidebar button { pointer-events: auto; }
    #sidebar.folded #sidebar-body { display: none; }
    /* ⚠⚠ **web2-48 48-11이 이 값을 다시 내렸다**(21 → 10 → **4**). 기록을 남긴다:
       44가 자와 손통을 짝 줄로 눌힌 것은 **세로 37px을 벌기 위해서**였고(grip44 ⑥의
       그 주석), 48-11이 그 짝을 되돌리면서 **46px을 다시 썼다** — 세로바 밑이
       778 → **824**가 돼 화면(800)을 넘졌고 세로바 팔 여섯이 빨개졌다.
       **그러나 배열은 무리를 말하는 채널이고**(R9) 그것을 돈으로 살 수 있는 자리는
       여기다 — 그룹 사이 여백은 **사이를 말하기만 하면 된다**(그룹 안 간격이 1px이므로
       4px이면 네 배라 채널이 산다). 아래 `.bar-divider`의 여백도 같은 이유로 줄였다. */
    .bar-gap { height: 4px; }
    /* 띠 재편(web2-44) — **한 줄에 짝으로 눕는 무리**. 손잡이가 처음으로 늘어나는 회차라
       (그리고 45·46·47이 더 더한다) 세로 한 줄로는 자리가 안 난다 — 같은 무리(시점 셋 ·
       실행취소 둘)를 가로로 눕혀 세로 자리를 비운다. 버튼 크기·패딩은 그대로다(표적
       무회귀 — 줄은 배치만 바꾼다). 여유는 e2e가 실측한다(#88 — 여기 수를 안 적는다). */
    .bar-row { display: flex; flex-direction: row; gap: var(--btn-gap); align-items: center; }

    /* 눌리는 것 전부의 바탕 — 배경도 테두리도 라운드도 없다(4-a).
       패딩 = 투명한 누름 여유(3번 관측 ②) — 보이는 크기는 svg가, 닿는 넓이는 이것이 정한다.
       흐름(flex) 안이라 이웃과 절대 안 겹친다(겹침 0의 구성적 보장 — e2e가 쌍별로 잰다). */
    .t {
      background: none; border: 0; border-radius: 0; padding: var(--hit-pad); margin: 0;
      display: block; cursor: pointer; color: var(--ui);
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s ease;
      opacity: .62;
    }
    .t svg { display: block; transition: transform .12s ease; }
    .t:hover { opacity: .85; }
    /* 아이콘 크기 — 기준 높이 × --ui-scale(단일 출처). width는 viewBox 비례(auto). */
    .ico-s  svg { height: calc(18px * var(--ui-scale)); width: auto; }  /* 접기 토글 */
    .ico-m  svg { height: calc(20px * var(--ui-scale)); width: auto; }  /* 실행취소·시점·치수·질감 */
    .ico-f  svg { height: calc(19px * var(--ui-scale)); width: auto; }  /* 파일·설정 */
    .ico-h  svg { height: calc(32px * var(--ui-scale)); width: auto; }  /* 지우개·면 */
    /* ⚠⚠ **web2-48 48-11이 62 → 55로 내렸다**(렌더 높이 93 → 82.5px). 그림은 한 톨도
       안 바뀌었다 — `docs/instrument-icons.md`의 path와 viewBox 그대로고 **배율만** 줄였다.
       기록: 44가 자와 손통을 짝 줄로 눌힌 것은 **세로 37px을 벌기 위해서**였고(grip44 ⑥),
       48-11이 그 짝을 되돌리면서 46px을 다시 썼다 — 세로바 밑이 778 → **824**로 화면(800)을
       넘어 세로바 팔 여섯이 빨개졌다. **배열은 무리를 말하는 채널이므로**(R9) 되돌린 것을
       지키고 **높이를 다른 데서 샀다**: 그룹 여백(10 → 4) · 구분선 여백(5 → 2) · 그리고 이 줄.
       연필·펌이 대상인 이유는 **띄에서 가장 큰 두 항목**이기 때문이고(93px · 다음이 54px),
       줄이면 띄의 크기 대역이 **오히려 고르게** 된다. 밑은 `sidebar.spec`의
       「접힌 연필·펌은 80px 이상」이고 82.5는 그 위다. */
    .ico-t  svg { height: calc(55px * var(--ui-scale)); width: auto; }  /* 접힌 연필·펌 */
    /* 연필통(web2-12 6번 → web2-19 3-b' **접힘**) — 가로로 누운 행 여섯. 연필을 누른
       동안만 펼쳐진다(평소 손 띠는 39px 정사각 대역만 남는다 — 폭 불일치의 답).
       ⚠ 기본 display를 none으로 두는 이 줄이 **정본**이다 — 같은 선택자의 규칙을 앞에
       하나 더 두면 뒤 규칙이 이겨 접힘이 죽는다(이 회차 초판이 그랬다 — 세로바가 822px로
       넘쳐 서랍이 빌드 식별자 아래 깔렸다). */
    /* ⚠⚠ **web2-30 3번 — 리본 안의 무엇도 리본의 길이를 바꾸지 않는다.**
       초판은 #tray가 세로바의 «흐름 안»에 있어 펼치면 아래 항목이 전부 밀려 내려갔다:
       아래쪽 버튼이 화면 밖으로 나가거나, 누르려던 자리에서 **빌드 식별자가 눌렸다**
       (사람 관측). 펼침은 전부 **왼쪽으로 겹쳐 뜬다**(overlay) — 자리는 main.ts가
       누른 버튼의 줄에 맞춘다. 선례(A-3): 프로크리에이트 브러시·크기 팝오버, 크리타
       팝업 팔레트, 스케치업 플라이아웃 — 전부 겹쳐 뜨지 밀어내지 않는다. */
    #tray, #pentray, #etray, #rolltray, #griptray, #painttray {
      display: none; position: fixed; z-index: 12;
      flex-direction: column; gap: var(--btn-gap); align-items: flex-end;
      /* ⚠⚠ **web2-48 48-7이 이 두 줄을 더했다.** 칠통에 색상 휠이 들어오면서
         통의 내용이 화면 높이를 넘었고, 그것이 조용한 결함을 냈다 — 줄은 flex 항목이라
         **기본값 `flex-shrink: 1`로 눌렸고**(휠 줄이 180px에서 **25px**로) 그 안의 캠버스는
         대체 요소라 안 줄어 **위의 단추들 위로 넘쳐 눈에 안 보이게 덮었다**.
         e2e가 「휠 캠버스가 마커 단추의 클릭을 가로채다」로 잡았다(사람 눈에는 «안 눌리는
         단추»로만 보였을 것이다). 줄은 안 줄이고(물건은 줄지 않는다) 넘치면 통이 굴러간다. */
      max-height: calc(100vh - 12px); overflow-y: auto; overscroll-behavior: contain;
    }
    #tray > *, #pentray > *, #etray > *, #rolltray > *, #griptray > *, #painttray > * { flex-shrink: 0; }
    #tray.open, #pentray.open, #etray.open, #rolltray.open, #griptray.open, #painttray.open { display: flex; }
    /* 칠통(web2-46) — 재료 줄의 톤 견본. 견본은 색 그 자체라 선 문법 비대상
       (instrument-icons.md 「마커·색연필」 절이 정본). 고른 견본은 테로 말한다. */
    .swatch { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid rgba(0,0,0,.14);
              padding: 0; cursor: pointer; touch-action: none; }
    .swatch.on { border: 1.5px solid #3a362f; outline: 1.5px solid rgba(58,54,47,.35); outline-offset: 1px; }
    .prow-name { min-width: 52px; text-align: left; }
    /* ── 칠통의 색상 휠·크기 트레이(web2-48 48-7 · 48-2) ────────────────────────
       ⚠ `.prow`는 **줄이지 버튼이 아니다**(div) — `.rrow`의 배경·여백만 물려받고
       누름 문법은 안 받는다. 46의 재료 줄이 쓰던 그 자리를 그대로 쓴다. */
    .prow { cursor: default; }
    /* web2-54 — 칠통 세로 예산(#97 짝 · mats52 ⑤가 «넘침 0»으로 지킨다): 「정면」 줄이
       들어오며 내용이 800px 화면을 13px 넘었다(실측 801 vs 788). 자리는 요소가 아니라
       규칙에서 낸다(#38) — 칠통의 «줄»(.prow — 크기·프리셋·휠·재료 11줄)의 세로 패딩을
       1px씩 줄인다(5→4 · 줄당 2px × 11 = 22px). 터치 표적(스와치 16px·프리셋 규격·휠
       132px)은 그대로다 — 줄 간 여백만 준다. 도구 줄(버튼 .rrow)은 안 건드린다. */
    #painttray .prow { padding-top: 4px; padding-bottom: 4px; }
    /* ⚠⚠ `position: static`을 **명시해야 한다**(web2-48 48-7 — e2e가 잡은 결함):
       이 파일 위쪽에 `canvas { position: absolute; inset: 0; display: block; }`이 있다 —
       화면 겹(#gl·#ink·#brushc…)을 위한 규칙인데 **요소 선택자라 새 캠버스에도
       그대로 걸렸다**. 그래서 휠 캠버스가 흐름에서 빠져 **칠통 전체를 덮었고**
       (실측: 통은 y 382..794인데 캠버스 사각이 1006,382,132,132 — 통의 좌상단),
       그 덤에 덤혀 단추들이 **보이긴 하는데 안 눌렸다**. 사람 눈에는 «고장난
       단추»로만 보였을 증상이다 — e2e가 「휠 캠버스가 마커 단추의 클릭을 가로채다」로
       잡았다(#73 ㉐의 친척: «문면상 이 규칙은 화면 겹의 것»이 아니라 실측이 정한다). */
    /* (48-2의 이산 크기 칸 .sizebtn · 52-3의 프리셋 세 칸 .presetbtn의 CSS는 **web2-64 64-7이 지웠다** — 58-1이 슬라이더로, 64가 칸 여섯(→ 68 필통)으로 대체) */
    /* ── 칠 패널(web2-64 §2) — 칠 도구를 든 «동안» 항상 뜬다(R8 정정 — DECISIONS). 통(tray)의 겹침 규칙(R2 · 왼쪽으로 겹쳐 뜬다)은
       그대로 쓰되 등록부 밖이다(바깥 누름으로 안 접힌다 · 도구를 놓아야 사라진다). 폭은 치수 리본의 내용 폭(208)에 맞춘다.
       #97: 줄은 flex-shrink 0(위 #painttray > * 규칙) · 견본 캔버스는 인라인 position:static. */
    /* web2-65 §2 ①④ — 폭 232 → 260: 이름이 안 잘릴 만큼이다(232에서는 「잉크펜 · dee…」로 끊겼다).
       자리는 **화면 왼쪽 가장자리**다(main.ts placeLeftPanel) — 작도 세로바와 안 겹친다. */
    #painttray { width: 260px; padding: 6px; background: rgba(252,251,248,.96); box-shadow: 0 1px 10px rgba(0,0,0,.09);
                 border-radius: 6px; gap: 3px; align-items: stretch; }
    /* 상한 표식(web2-67 0-1) — 패널 우상단 구석의 작은 점. 토스트를 대신한다(걸려 있는
       동안만 · 설명은 호버). 흐름 밖(absolute)이라 줄 배치를 안 민다. */
    #paint-clamp-dot { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px;
                       border-radius: 50%; background: #c4813a; pointer-events: auto; }
    /* 지우개 고정 칸(web2-67 0-6 → **68**: 필통의 여덟째 칸 · 맨 끝 고정 · 저장 밖). 경도(딱딱/부드럼)는 칸의
       경도 글자 자리(.pcgrade — #paint-erase-soft). 단추는 .favbtn/.ebtn(줄이 아니다 — .rrow 줄 셈(mats46 ①)을 오염시키면 안 된다). */
    .ebtn { border: 1px solid rgba(60,56,49,.14); border-radius: 4px; background: rgba(255,255,255,.55);
            cursor: pointer; touch-action: none; font: 13px system-ui, sans-serif; color: #3c3831; }
    .pcell { position: relative; display: flex; min-width: 0; }
    .pcell > .favbtn { flex: 1; }
    #paint-erase.on, #paint-erase-soft.on { background: rgba(60, 56, 49, .14); }
    #painttray .rrow { box-shadow: none; background: transparent; }
    #painttray .rrow.on { background: rgba(60, 56, 49, .10); }
    #painttray .prow { padding-top: 4px; padding-bottom: 4px; }
    #paint-brush-btn { align-items: center; gap: 8px; padding: 6px; border-radius: 4px; background: rgba(255,255,255,.6); }   /* 필통 머리(68) — 지금 브러시 */
    /* web2-65 §2 ④ — **자르지 않는다**(잘리면 이름이 아니다): 말줄임 대신 줄바꿈이다. */
    #paint-brush-name { font: 12px/1.25 system-ui, sans-serif; text-align: left; min-width: 0; white-space: normal; }
    #paint-brush-name b { font-weight: 600; white-space: normal; overflow-wrap: anywhere; }
    #paint-brush-name span { font-size: 10.5px; white-space: normal; overflow-wrap: anywhere; }
    #paint-color { gap: 8px; }
    .colordot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(60,56,49,.35); padding: 0; cursor: pointer;
                touch-action: none; flex-shrink: 0; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
    /* 색상 휠 통(64 → **web2-67 0-4**) — 옆 펼침(fixed)이 아니라 **패널 안 세로 행**이다
       (사람 판정 「옆으로 펼쳐져서 화면을 가리는 느낌」): 색 원 줄 바로 아래에 접혔다
       펴진다. 열려도 캔버스를 가리는 폭은 패널 폭 그대로다. 툴팁 없음(같은 판정). */
    #paint-wheelbox { position: static; flex-direction: column; gap: 4px; padding: 4px 0; display: flex; align-items: center; }
    #paint-wheelbox[hidden] { display: none; }
    #paint-wheel-cv { position: static; inset: auto; display: block; touch-action: none; cursor: crosshair; }
    #paint-hex { min-width: 0; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #4a463f; }
    /* 필통 여덟(web2-68 §1 — 옛 여섯 칸(64~67)의 자리) — 4×2 격자 · 칸 = 도구 그림(촉에 그 칸의 색) + 경도 글자(연필·목탄 —
       위아래로 끌면 경도) + 아래 작은 숫자 둘(크기 px · 불투명 % · 9.5px — Feather 2.x 채록 §B-0). 견본 획이 아니라 도구 그림인
       이유: 사람 판정 「필통 시스템으로」 — 칸은 «어느 도구인가»를 말하고 색·크기·불투명은 촉·숫자가 말한다. */
    #paint-favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 4px 4px; }
    .favbtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; background: rgba(255,255,255,.55); border: 1px solid rgba(60,56,49,.12);
              border-radius: 4px; padding: 3px 2px 2px; margin: 0; color: #4a463f; cursor: pointer; touch-action: none; min-width: 0; min-height: 56px; }
    .favbtn .pcpic { display: block; width: 32px; height: 32px; }
    .favbtn .pcpic svg { width: 32px; height: 32px; display: block; }
    .favbtn .pcgrade, .pcell .pcgrade { position: absolute; top: 2px; right: 3px; font: 600 10px/1 system-ui, sans-serif; color: #3c3831;
                                        padding: 2px 3px; border-radius: 3px; background: rgba(255,255,255,.85); border: 1px solid rgba(60,56,49,.18);
                                        cursor: ns-resize; touch-action: none; user-select: none; }
    .favbtn .pcgrade[hidden] { display: none; }
    .pcell .pcgrade { cursor: pointer; z-index: 1; }
    .favbtn .pcnums { font: 9.5px/1.1 system-ui, sans-serif; color: #6b665c; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .favbtn.on { background: rgba(60, 56, 49, .14); border-color: rgba(60,56,49,.4); }
    /* 크기 눈금 표식(web2-68 §3-2) — 트랙 위 √2 등비 점. 점만 누를 수 있고 트랙의 끌기는 연속 그대로(58 R1 철회). */
    #paint-size-tickwrap { position: relative; display: inline-block; flex-shrink: 0; width: 132px; }
    #paint-size-tickwrap input[type=range] { width: 132px; margin: 0; }
    #paint-size-ticks { position: absolute; left: 0; right: 0; top: -3px; height: 8px; cursor: pointer; touch-action: none; }
    #paint-size-ticks .tick { position: absolute; top: 1px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%;
                              background: #8d8880; pointer-events: none; }
    /* 브러시 목록 두 칸(web2-68 §3-1) — 왼쪽 세트 열의 고른 세트 */
    .brushpick-set.on { background: rgba(60,56,49,.12); font-weight: 600; }
    .rrow { display: flex; flex-direction: row; align-items: center; gap: 7px;
            font: 12px/1 system-ui, sans-serif; color: #4a463f; white-space: nowrap;
            background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
            padding: 5px 9px; touch-action: none; border: 0; cursor: pointer; }
    .rrow svg { height: calc(15px * var(--ui-scale)); width: auto; }
    .rrow.disabled { opacity: .38; }
    /* 칠통(web2-46) — 고른 도구·자동 줄의 표시(지우개 크기 줄 .erow.on의 문법 그대로) */
    .rrow.on { background: rgba(60, 56, 49, .10); }
    /* 사람 스텐실 모달(web2-47) — 설정에서만 열리는 그리기 판 */
    #stencil-modal { position: fixed; inset: 0; z-index: 30; display: flex;
      align-items: center; justify-content: center; background: rgba(40,38,34,.25); }
    #stencil-modal[hidden] { display: none; }
    #stencil-box { background: #fcfbf8; padding: 12px; box-shadow: 0 4px 30px rgba(0,0,0,.2);
      font: 12px/1.5 system-ui, sans-serif; color: #4a463f; }
    #stencil-canvas { border: 1px solid #c9c4bb; background: #fff; display: block;
      margin: 8px 0; touch-action: none; cursor: crosshair; }
    .stencil-row { display: flex; gap: 8px; }
    .stencil-row button { font: 12px system-ui, sans-serif; padding: 4px 10px; }
    .trow svg { height: calc(15px * var(--ui-scale)); width: auto; }
    /* 펜 촉 줄(web2-30 2번) — **그 굵기의 실제 선 견본**이 1:1로 그려진다(원칙 e:
       선폭이 화면 고정이므로 견본과 그은 선이 같은 px다). 아이콘 문법은 연필통 줄과
       같은 자리·같은 크기이고, 앞의 촉 도형만 펜의 것이다. */
    .nrow svg { height: calc(15px * var(--ui-scale)); width: auto; }
    /* 지우개 크기 줄(web2-34 3번 · 화면 규칙 R1) — **1:1이라 배수를 안 건다.**
       ⚠⚠ 다른 줄들은 `--ui-scale`로 키우는데(`.trow`·`.nrow`) 이 줄만 안 키운다:
       지우개 자국은 **화면 고정 px 원**이므로 줄의 원을 조금이라도 늘리거나 줄이면
       그 순간 견본이 «비율만 보이는 동그라미»로 되돌아간다(그것이 34-3의 병이었다 —
       옛 막대의 동그라미는 실제의 27.5~112.5%였다). svg에 width/height를 viewBox와
       같은 px로 박고 CSS는 아무 배수도 안 건다.
       ⚠ 그래서 `.tool`(선택 시 svg를 1.14배로 키운다)도 **안 붙인다** — 고른 줄의
       견본만 1.14배가 되면 그 줄에서 1:1이 깨진다. 고른 표시는 크기가 아니라
       **아주 옅은 바탕**이다(4-a: 「배경이 필요하면 아주 옅게」). */
    .erow { touch-action: none; line-height: 0; border-radius: 6px; }
    .erow.on { opacity: 1; background: rgba(60, 56, 49, .10); }
    /* **선택된 도구가 앞으로 나온다** — 강조 박스가 아니라 위치와 크기다(4-d).
       ⚠ 변형은 **svg에만** 건다(web2-12 3번) — 버튼 상자에 걸면 누름 사각형이 이웃을
       파고들어 겹침 0이 깨진다. 시각은 나오고 누름 자리는 제자리다. */
    .tool.on { opacity: 1; }
    .tool.on svg { transform: translateX(-10px) scale(1.14); }
    .tool { touch-action: none; }

    /* 파일·설정 — 접힌 채로 있고, 펴면 아주 옅은 바탕만 깐다(4-a: 「배경이 필요하면 아주 옅게」) */
    /* ⚠ **화면 밖으로 안 나가게 아래에 붙인다.** `position:absolute`로 요약 옆에 흘려 두었더니
       세로바가 화면 가운데에 있어 설정 패널(열 줄)이 **아래로 삐져나갔다** — 「지면 격자」
       체크박스가 뷰포트 밖(y=793 / 높이 720)에 있어 눌리지 않았다(2026-08-21 e2e가 잡았다).
       파일·설정은 세로바의 «아래» 묶음이므로(4-i) 우하단 고정이 자리와도 맞는다. */
    details.pane > div {
      /* ⚠⚠ **z-index 13**(web2-30 3번 별건) — 진단 패널·자립 깃발(#diagpanel·#diagctl, 둘 다
         z 12)보다 **위**여야 한다. 30-10이 진단의 여닫이를 설정 패널로 옮기면서 셋이 전부
         우하단에 모였고, 초판(z 11)에서는 **열린 진단 패널이 「진단」 단추를 가려** 다시
         못 눌렀다(전량 e2e가 잡았다 — `#diagctl` intercepts pointer events).
         지금 만지고 있는 패널이 위로 온다. */
      /* ⚠⚠ **web2-34 6번이 자리를 옮겼다 — 우하단 → 위 띠 아래**(R5 · #79).
         옛 자리(right 54 · bottom 10)는 빌드 식별자·진단 패널·자립 깃발과 **같은 모서리**였고
         그 다툼을 **두 번 z로 풀고 있었다**(이 규칙 11→13 · `#diagctl` 12→9). #79의 문면이
         「겹치면 자리를 나누고 z로 풀려 하지 마라」다 — 자리를 나눴다.
         `top`은 `#display-pop`과 같은 줄(48px)이고 `right`는 main.ts의 `placeUnder`가
         **제 요약 아래**에 맞춘다(팝오버가 제 단추 아래 서는 것과 같은 규약 — #54). */
      position: fixed; right: var(--top-lane); top: 48px; z-index: 13;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; white-space: nowrap;
      max-height: calc(100vh - 58px); overflow-y: auto;
      /* ⚠ 터치 스크롤은 **막힌 채로 뒀다** — 유효 사슬이 수리 전에도 none이었고(전 요소가
         #app 자손) 「패널을 스크롤 못 한다」는 관측이 없다. 관측 없이 pan-y로 푸는 것은
         근거 없는 넓힘이다(A-3 · 2차 리뷰어 [15]가 초판의 pan-y를 잡았다 — AS-C26).
         휠 스크롤은 touch-action과 무관해 데스크톱은 그대로 돈다. */
      font: 12px system-ui, sans-serif; color: #4a463f;
    }
    /* 뷰 썸네일 팝오버(web2-12 5번) — 뷰 버튼 왼쪽에 펼쳐진다. 눈으로 보고 고른다. */
    #views-pop {
      position: fixed; z-index: 30;
      background: rgba(252,251,248,.97); box-shadow: 0 1px 10px rgba(0,0,0,.12);
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
      max-height: calc(100vh - 24px); overflow-y: auto;
    }
    #views-pop .vrow { display: flex; align-items: flex-start; gap: 4px; }
    #views-pop .vpick {
      background: none; border: 0; padding: 0; cursor: pointer; display: block;
      font: 13px system-ui, sans-serif; color: #4a463f;
    }
    #views-pop .vpick img { display: block; box-shadow: 0 0 0 1px #e5e0d6; }
    #views-pop .vpick:hover img { box-shadow: 0 0 0 1px #8d8880; }
    #views-pop .vdel {
      background: none; border: 0; cursor: pointer; padding: 2px 4px;
      font: 12px system-ui, sans-serif; color: #a89f8e;
    }
    #views-pop .vdel:hover { color: #4a463f; }

    /* 버튼 곁 확인(web2-12 4번) — 누른 버튼의 왼쪽 옆. 다른 패널과 같은 옅은 바탕(4-a). */
    .confirm-pop {
      position: fixed; z-index: 30;
      background: rgba(252,251,248,.97); box-shadow: 0 1px 10px rgba(0,0,0,.12);
      padding: 9px 12px; font: 13px system-ui, sans-serif; color: #4a463f;
      display: flex; gap: 12px; align-items: center; white-space: nowrap;
    }
    .confirm-pop u { cursor: pointer; }
    details.pane summary { list-style: none; cursor: pointer; }
    details.pane summary::-webkit-details-marker { display: none; }
    .pane button {
      background: none; border: 0; padding: 5px 0; text-align: left; cursor: pointer;
      font: 13px system-ui, sans-serif; color: #4a463f; /* 펜으로 누르는 줄 — 닿는 높이 ≈ 27px(지시 5) */
    }
    .pane button:hover { color: #111; }
    .pane label { display: flex; align-items: center; gap: 6px; }
    .pane .head { color: var(--ui-faint); letter-spacing: .04em; }

    /* ── 문서 이름 · 최근 드로잉(web2-43 3·4번) ────────────────────────────────
       썸네일이 먼저 오고 이름이 뒤다 — 시점을 **그림으로 알아보는** 선례가 이미 있다
       (종이 띠 `.ptab`의 머리주석 · Procreate 레이어 목록). 여기 썸네일은 종이 띠의
       것보다 조금 크다: 파일 목록은 **어느 그림인가**를 가리는 자리이기 때문이다. */
    .doc-name {
      font: 13px/1.2 system-ui, sans-serif; color: #4a463f; background: none;
      border: 0; border-bottom: 1px solid var(--ui-faint); outline: none;
      padding: 3px 0; width: 148px;
    }
    .doc-name:focus { border-bottom-color: var(--ui); }
    #recent { display: flex; flex-direction: column; gap: 2px; max-width: 168px; }
    #recent .rempty { color: var(--ui-faint); font: 12px system-ui, sans-serif; padding: 3px 0; }
    #recent .rrow { display: flex; align-items: center; gap: 2px; }
    #recent .rpick {
      background: none; border: 0; padding: 2px 0; cursor: pointer; flex: 1 1 auto;
      display: flex; align-items: center; gap: 6px; min-width: 0;
      font: 12px/1.2 system-ui, sans-serif; color: #4a463f; text-align: left;
    }
    #recent .rthumb {
      width: 42px; height: 28px; flex: 0 0 auto; object-fit: cover; display: block;
      background: var(--paper); box-shadow: 0 0 0 1px #e5e0d6;
    }
    #recent .rpick:hover .rthumb { box-shadow: 0 0 0 1px #8d8880; }
    #recent .rtext { display: flex; flex-direction: column; min-width: 0; }
    #recent .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 96px; }
    #recent .rwhen { color: var(--ui-faint); font-size: 11px; }
    /* 지금 열려 있는 문서 — 색이 아니라 **형태**가 가른다(종이 띠와 같은 규칙 둘) */
    #recent .rrow.on .rthumb { box-shadow: 0 0 0 1px var(--ui); }
    #recent .rrow.on .rname { color: #111; }
    #recent .rdel {
      background: none; border: 0; cursor: pointer; padding: 2px 4px; flex: 0 0 auto;
      font: 12px system-ui, sans-serif; color: #a89f8e;
    }
    #recent .rdel:hover { color: #4a463f; }

    /* 치수 리본(web2-08 지시 4-3) — 우측, 접힌다. 옅은 바탕(4-a 「배경이 필요하면 아주 옅게」) */
    #dimpanel {
      position: fixed; right: var(--dim-right); top: 96px; z-index: 11; /* 시점바(right:54)의 왼쪽 — 열면 토글을 안 덮는다 */
      display: flex; flex-direction: column; gap: 7px; width: 208px;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; font: 12px system-ui, sans-serif; color: #4a463f;
    }
    #dimpanel.folded { display: none; }
    #dimpanel .head { color: var(--ui-faint); letter-spacing: .04em; }
    #dim-live { font: 20px/1.2 system-ui, sans-serif; color: #3c3831; min-height: 24px; }
    /* 축척 줄(web2-32 5번) — 값이 아니라 **상태**라 옅다(제목과 같은 대역). */
    #dim-scale { font: 11px/1.5 system-ui, sans-serif; color: var(--ui-faint); }
    /* 어긋남(web2-32 7번) — **표시만 한다. 고치지 않는다.** 오류 대역을 쓰지 않는 이유:
       사람이 적은 값은 틀린 것이 아니라 «다른 것»이다(#61 — 프로그램이 안 덮어쓴다). */
    #dim-skew { font: 11px/1.5 system-ui, sans-serif; color: #a8763a; }
    #dim-skew[hidden] { display: none; }
    /* ⚠ 전역 canvas 규칙(absolute·inset 0)이 여기도 걸린다 — 흐름 안으로 되돌린다.
       처음에 이것이 없어서 필기 칸이 패널 좌상단에 겹쳐 제목·숫자를 덮었다(스크린샷이 잡았다). */
    #dim-ink { position: static; inset: auto; width: 184px; height: 72px; background: #fff;
      box-shadow: inset 0 0 0 1px #e5e0d6; touch-action: none; cursor: crosshair; }
    #dimpanel button {
      background: none; border: 0; padding: 2px 0; cursor: pointer;
      font: 12px system-ui, sans-serif; color: #4a463f; text-decoration: underline;
    }
    #dimpanel label { display: flex; align-items: center; gap: 6px; }
    #dimpanel .on { color: #1a6ac2; }
    #dim-read { min-width: 56px; font: 13px monospace; color: #3c3831; }
    /* 숫자 키패드(web2-10 지시 8-a) — **확정 경로**. 항상 펴져 있고 인식을 안 거친다.
       치수는 첫 입력이 scaleRef를 정하는 자리라(3이 8로 읽히면 전체 실척이 조용히 틀린다)
       확률적 입력(필기·음성)만으로는 안 된다 — A-3 「조용히 틀린 배치를 만들지 않는다」.
       키 크기는 지시 5의 대역(닿는 높이 ≥ 27px)에 맞춘다 — 펜으로 누르는 판이다. */
    #pad-read { font: 17px/1.4 monospace; color: #3c3831; min-height: 24px; }
    /* 행 높이는 격자가 정한다 — 버튼 height를 34로 고정하면 «적용»의 두 줄 스팬이 안 는다
       (실측 34로 걸렸다 — 팔이 잡았다). */
    #pad-keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 34px; gap: 5px; }
    #pad-keys button {
      background: none; border: 0; cursor: pointer; height: 100%; width: 100%;
      font: 16px system-ui, sans-serif; color: #3c3831; text-decoration: none;
      box-shadow: inset 0 0 0 1px #e5e0d6; padding: 0;
    }
    #pad-keys button:hover { box-shadow: inset 0 0 0 1px #b8b3ab; }

    /* ── 자체 로딩화면(web2-10 지시 2·3) ─────────────────────────────────
       크롬이 매니페스트로 만드는 스플래시는 PNG 아이콘을 확대해 흐리다 — 그 답이
       인라인 SVG다(어떤 밀도에서도 선명하다). **인라인이어야 한다**: JS 번들을
       기다리면 빈 화면이 먼저 번쩍인다. 배경은 매니페스트 background_color와 같은
       #f5f3ee — 크롬 스플래시에서 이 화면으로 넘어올 때 안 튄다.
       pointer-events:none — 이 겹이 떠 있는 동안에도 펜 입력을 안 막는다.
       ⚠ SVG의 클래스는 전부 #boot 아래로 스코프한다 — 인라인 SVG의 <style>은
       문서 전역이라 앱 쪽과 충돌할 수 있다(그래서 icon.svg의 <style>을 안 가져왔다). */
    #boot {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f5f3ee; pointer-events: none;
      transition: opacity .25s ease;
    }
    #boot.gone { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
    #boot svg { width: min(46vmin, 300px); height: auto; display: block; }
    /* 크레딧 색 — 이 저장소의 무채색 판정(채널 차 ≤ 12) 안의 회색으로.
       --ui(#8d8880)는 차 13이라 그 기준 밖이다(1차 리뷰어 [10] — 「무채색」을 한 뜻으로). */
    #boot .credit {
      margin-top: 22px; text-align: center;
      font: 12px/2 system-ui, sans-serif; color: #8c8881; letter-spacing: .03em;
    }
    #boot .credit b { display: block; font-weight: 400; font-size: 15px; color: #6b665f; letter-spacing: .12em; }
    /* icon.svg의 작도 클래스 — 원본 값 그대로, #boot 스코프로만 */
    #boot .sil{stroke:#3c3831;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
    #boot .edge{stroke:#3c3831;stroke-width:1.6;fill:none;stroke-linecap:round}
    #boot .det{stroke:#3c3831;stroke-width:1.6;fill:none;opacity:.92;stroke-linecap:round;stroke-linejoin:round}
    #boot .det2{stroke:#3c3831;stroke-width:1.1;fill:none;opacity:.8;stroke-linecap:round;stroke-linejoin:round}
    #boot .conv{stroke:#a89f8e;stroke-width:1.3;opacity:.85;stroke-linecap:round}
    #boot .hor{stroke:#8b857a;stroke-width:2;opacity:.95}
    #boot .vp{stroke:#3c3831;stroke-width:2.4;opacity:.85;stroke-linecap:round}

    /* 빌드 식별자 — 배포 판정자(PITFALLS #58). ⚠⚠ **web2-30 3번 별건: 입력을 안 받는다.**
       배포를 판정하는 **표시**지 단추가 아니다. 종전에는 여기를 눌러 진단 패널을 폈는데,
       우하단이라 다른 버튼을 겨눈 손이 이것을 눌렀다(사람 관측). 진단의 여닫이는
       **설정 패널의 「진단」**으로 옮겼다 — 태블릿의 유일한 판독 통로라 없애진 않는다
       (web2-10 지시 4). 닿는 넓이를 키우던 패딩도 뜻을 잃어 줄였다. */
    #buildid {
      position: fixed; right: 6px; bottom: 4px; z-index: 12;
      font: 10px monospace; color: #c9c4bc;
      pointer-events: none;
      padding: 4px;
    }
    /* 진단 패널(web2-10 지시 4) — 전부 한 화면에. 다른 패널과 같은 옅은 바탕(4-a).

       #buildid는 별개 요소). 줄이 늘어 치수 필기 칸(#dim-ink)까지 자라면 포인터를
       삼켜 필기가 조용히 무시됐다(web2-14 e224d82부터 — web2-16 1부가 표식으로 확인).
       패널이 앞으로 얼마나 자라도 입력을 못 삼키게 DOM에서도 관측만 하게 한다.
       대가: 패널 글자를 마우스로 긁어 복사할 수 없다 — 태블릿(주 기기)에는 없던 길이다. */
    #diagpanel {
      position: fixed; right: 6px; bottom: 26px; z-index: 12;
      max-width: min(86vw, 560px);
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; font: 11px/1.7 monospace; color: #4a463f;
      overflow-wrap: anywhere; pointer-events: none;
    }
    #diagpanel .k { color: #a89f8e; display: inline-block; min-width: 118px; }
  </style>

  <script>
    // 브라우저 줌 보험(web2-09 지시 2) — 뷰포트 메타와 touch-action이 **무시되는** 환경용.
    // iOS 사파리는 user-scalable=no를 안 읽고, 안드로이드 접근성 「강제 확대」는 메타를 이긴다.
    // 두 손가락 touchmove만 막는다 — 앱의 조작은 Pointer Events로 받으므로(input.ts)
    // 파생 터치 이벤트의 preventDefault가 펜·한 손가락·앱의 두 손가락 팬줌을 안 건드린다.
    // (한 손가락 touchstart는 막지 않는다 — 그것을 막으면 click이 죽어 단추가 안 눌린다)
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault()
    }, { passive: false })
    // 사파리 전용 핀치 채널 — gesture*는 사파리에만 있다. 실기기(안드로이드)로는 확인 못 한다.
    for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
      document.addEventListener(t, (e) => e.preventDefault())
    // 데스크톱의 브라우저 줌(Ctrl+휠 = 트랙패드 핀치 포함). 캔버스 위에서는 어차피
    // 앱 휠 핸들러가 전부 preventDefault한다(input.ts) — 이 줄은 그 바깥(패널·단추)을 덮는다.
    window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault() }, { passive: false })
  </script>
  <script type="module" src="/src/app/main.ts"></script>
