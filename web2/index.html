<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Brunelleschi</title>
  <!-- 설치된 PWA가 안 깨지게 옛 앱(web/)과 같은 매니페스트·아이콘을 그대로 쓴다.
       옛 start_url이 `./`라 전환 후 이 화면으로 들어온다. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    /* ── 그리기 도구의 UI (지시 4) ───────────────────────────────────────
       박스도 테두리도 없다. 요소만 둔다(4-a). 색은 회색조 하나이고 강조는 안 쓴다 —
       선택은 색이 아니라 **위치와 크기**로 보인다(4-d, 프로크리에이트 선례).
       그림이 주인공이므로 UI는 물러난다(4-c). */
    :root {
      --paper: #f5f3ee;
      --ui: #8d8880;        /* 안 고른 도구 — 물러나 있다 */
      --ui-faint: #b8b3ab;
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { position: absolute; inset: 0; display: block; }
    #ink { z-index: 2; }
    #gl { z-index: 1; }

    /* 알림 — 최상단 한 줄. 박스 없음. **오류가 있을 때만 뜬다**(4-b). 선택은 밑줄 단어. */
    #notice {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      font: 13px/1.8 system-ui, sans-serif; text-align: center;
      color: #6b665f; pointer-events: none; height: 24px;
    }
    #notice u { pointer-events: auto; cursor: pointer; }

    /* 우측 상단 — 큐브(캔버스에 그림) 아래 시점 */
    #viewbar {
      position: fixed; top: 112px; right: 10px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    #views { display: flex; flex-direction: column; gap: 6px; align-items: center; }

    /* 우측 세로바 하나 — 위: 실행취소 · 가운데: 도구·굵기 · 아래: 파일·설정(접힘).
       좌측과 하단은 비운다(4-i). */
    #sidebar {
      position: fixed; top: 50%; right: 6px; transform: translateY(-50%);
      z-index: 10; display: flex; flex-direction: column; gap: 6px; align-items: center;
    }
    #sidebar-body { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    #sidebar.folded #sidebar-body { display: none; }
    .bar-gap { height: 14px; }

    /* 눌리는 것 전부의 바탕 — 배경도 테두리도 라운드도 없다(4-a) */
    .t {
      background: none; border: 0; border-radius: 0; padding: 0; margin: 0;
      display: block; cursor: pointer; color: var(--ui);
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, opacity .12s ease;
      opacity: .62;
    }
    .t svg { display: block; }
    .t:hover { opacity: .85; }
    /* **선택된 도구가 앞으로 나온다** — 강조 박스가 아니라 위치와 크기다(4-d) */
    .tool.on { opacity: 1; transform: translateX(-7px) scale(1.14); }
    .tool { touch-action: none; }

    /* 파일·설정 — 접힌 채로 있고, 펴면 아주 옅은 바탕만 깐다(4-a: 「배경이 필요하면 아주 옅게」) */
    /* ⚠ **화면 밖으로 안 나가게 아래에 붙인다.** `position:absolute`로 요약 옆에 흘려 두었더니
       세로바가 화면 가운데에 있어 설정 패널(열 줄)이 **아래로 삐져나갔다** — 「지면 격자」
       체크박스가 뷰포트 밖(y=793 / 높이 720)에 있어 눌리지 않았다(2026-08-21 e2e가 잡았다).
       파일·설정은 세로바의 «아래» 묶음이므로(4-i) 우하단 고정이 자리와도 맞는다. */
    details.pane > div {
      position: fixed; right: 38px; bottom: 10px; z-index: 11;
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; white-space: nowrap;
      max-height: calc(100vh - 20px); overflow-y: auto;
      font: 12px system-ui, sans-serif; color: #4a463f;
    }
    details.pane summary { list-style: none; cursor: pointer; }
    details.pane summary::-webkit-details-marker { display: none; }
    .pane button {
      background: none; border: 0; padding: 3px 0; text-align: left; cursor: pointer;
      font: 12px system-ui, sans-serif; color: #4a463f;
    }
    .pane button:hover { color: #111; }
    .pane label { display: flex; align-items: center; gap: 6px; }
    .pane .head { color: var(--ui-faint); letter-spacing: .04em; }

    /* 치수 리본(web2-08 지시 4-3) — 우측, 접힌다. 옅은 바탕(4-a 「배경이 필요하면 아주 옅게」) */
    #dimpanel {
      position: fixed; right: 40px; top: 96px; z-index: 11;
      display: flex; flex-direction: column; gap: 7px; width: 208px;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; font: 12px system-ui, sans-serif; color: #4a463f;
    }
    #dimpanel.folded { display: none; }
    #dimpanel .head { color: var(--ui-faint); letter-spacing: .04em; }
    #dim-live { font: 20px/1.2 system-ui, sans-serif; color: #3c3831; min-height: 24px; }
    #dim-ink { width: 184px; height: 72px; background: #fff;
      box-shadow: inset 0 0 0 1px #e5e0d6; touch-action: none; cursor: crosshair; }
    #dimpanel button {
      background: none; border: 0; padding: 2px 0; cursor: pointer;
      font: 12px system-ui, sans-serif; color: #4a463f; text-decoration: underline;
    }
    #dimpanel label { display: flex; align-items: center; gap: 6px; }
    #dimpanel .on { color: #1a6ac2; }
    #dim-read { min-width: 56px; font: 13px monospace; color: #3c3831; }

    /* 빌드 식별자 — 배포 판정자(PITFALLS #58). 물러나 있다. */
    #buildid {
      position: fixed; right: 6px; bottom: 4px; z-index: 10;
      font: 10px monospace; color: #c9c4bc; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <canvas id="ink"></canvas>
    <div id="notice"></div>
    <div id="buildid"></div>

    <!-- 우측 상단: 큐브(캔버스에 그려짐) 아래 시점 -->
    <div id="viewbar">
      <button id="btn-draw-view" class="t" title="작도 시점으로" aria-label="작도 시점">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M3 9.4 10 3.6l7 5.8" /><path d="M5.2 8.6V16h9.6V8.6" />
        </svg>
      </button>
      <button id="btn-save-view" class="t" title="현재 시점 저장" aria-label="시점 저장">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="10" cy="10" r="6.4" /><path d="M10 6.6v6.8M6.6 10h6.8" />
        </svg>
      </button>
      <div id="views"></div>
      <button id="dim-toggle" class="t" title="치수 — 리본 패널" aria-label="치수">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="2.5" y="7" width="15" height="6" />
          <path d="M5.5 7v2.4M8.5 7v3.4M11.5 7v2.4M14.5 7v3.4" />
        </svg>
      </button>
    </div>

    <!-- 치수 리본(지시 4) — 화면에 쓰면 선인지 숫자인지 알 수 없으므로 쓰는 자리가 따로 있다 -->
    <div id="dimpanel" class="folded">
      <div class="head">치수</div>
      <div id="dim-live">—</div>
      <canvas id="dim-ink" width="184" height="72"></canvas>
      <div style="display:flex;gap:10px;align-items:center">
        <span id="dim-read"></span>
        <button id="dim-clear" title="쓴 것을 지운다">지운다</button>
        <button id="btn-voice" title="음성 치수 — 켜져 있는 동안만 듣는다">음성</button>
      </div>
      <label>단위
        <select id="dim-unit">
          <option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option>
        </select>
      </label>
      <label><input id="chk-dimsnap" type="checkbox"> 치수 스냅
        <select id="dimsnap-step">
          <option>1</option><option>5</option><option>10</option><option selected>50</option><option>100</option>
        </select> mm
      </label>
      <label><input id="chk-exact" type="checkbox"> 무한소수 표기</label>
    </div>

    <!-- 우측 세로바 -->
    <div id="sidebar">
      <button id="sidebar-toggle" class="t" title="접기/펴기" aria-label="접기/펴기">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M3 5.5h12M3 9h12M3 12.5h12" />
        </svg>
      </button>
      <div id="sidebar-body">
        <button id="btn-undo" class="t" title="실행취소 (Ctrl+Z)" aria-label="실행취소">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M6.4 5.2 3.2 8.4l3.2 3.2" /><path d="M3.2 8.4h7.6a4.4 4.4 0 0 1 0 8.8H7" />
          </svg>
        </button>
        <button id="btn-redo" class="t" title="다시실행 (Ctrl+Y)" aria-label="다시실행">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M13.6 5.2 16.8 8.4l-3.2 3.2" /><path d="M16.8 8.4H9.2a4.4 4.4 0 0 0 0 8.8H13" />
          </svg>
        </button>

        <div class="bar-gap"></div>

        <!-- 연필 — 몸통의 창에 지금 심(2H…2B)이 보인다. **그 창이 곧 슬라이더다**(4-e):
             위아래로 밀면 심이 바뀐다. 별도 컨트롤을 안 둔다. -->
        <button id="btn-pencil" class="t tool" title="연필 — 위아래로 밀면 심이 바뀐다" aria-label="연필">
          <svg width="26" height="62" viewBox="0 0 26 62">
            <path d="M8 3h10v40H8z" fill="#cfc7b6" />
            <path d="M8 3h3.4v40H8z" fill="#e0d9ca" />
            <path d="M14.6 3H18v40h-3.4z" fill="#bbb2a0" />
            <rect x="8" y="11" width="10" height="13" fill="#faf8f3" />
            <text id="lead-text" x="13" y="21" text-anchor="middle"
                  font-family="system-ui, sans-serif" font-size="8.5" fill="#3c3831">HB</text>
            <path d="M8 43h10l-5 9z" fill="#e6dfd0" />
            <path id="lead" d="M11.4 48.9 13 52l1.6-3.1z" fill="#5a5a5a" />
          </svg>
        </button>

        <!-- 펜 — 제도펜. 니브가 보인다. 굵기는 아래 막대에서 고른다(4-f). -->
        <button id="btn-pen" class="t tool" title="펜 — 잉크" aria-label="펜">
          <svg width="26" height="62" viewBox="0 0 26 62">
            <path d="M8.6 3h8.8v32H8.6z" fill="#7f7a72" />
            <path d="M8.6 3h3v32h-3z" fill="#98938a" />
            <path d="M9.4 35h7.2v6H9.4z" fill="#5d5952" />
            <path d="M10.2 36.4h5.6M10.2 38.2h5.6" stroke="#837f78" stroke-width=".7" />
            <path d="M9.4 41h7.2l-3.6 8z" fill="#6e6a63" />
            <rect id="nib" x="12.2" y="49" width="1.6" height="7" fill="#101014" />
          </svg>
        </button>

        <!-- 지우개 둘 — 연필 지우개는 흑연만, 펜 지우개는 잉크만(선따기·4-h) -->
        <button id="btn-eraser-pencil" class="t tool" title="연필 지우개 — 흑연만 지운다" aria-label="연필 지우개">
          <svg width="26" height="32" viewBox="0 0 26 32">
            <path d="M6 20 13 6h7l-7 14z" fill="#e4ddcd" stroke="#b3ab9a" stroke-width="1" />
            <path d="M6 20h7v6H6z" fill="#d5cdbb" stroke="#b3ab9a" stroke-width="1" />
            <path d="M13 20h7l-7 6z" fill="#c9c0ad" stroke="#b3ab9a" stroke-width="1" />
          </svg>
        </button>
        <button id="btn-eraser-ink" class="t tool" title="펜 지우개 — 잉크만 지운다" aria-label="펜 지우개">
          <svg width="26" height="32" viewBox="0 0 26 32">
            <path d="M6 20 13 6h7l-7 14z" fill="#e4ddcd" stroke="#8b857a" stroke-width="1" />
            <path d="M6 20h7v6H6z" fill="#3a3833" stroke="#8b857a" stroke-width="1" />
            <path d="M13 20h7l-7 6z" fill="#2b2925" stroke="#8b857a" stroke-width="1" />
          </svg>
        </button>

        <!-- 면 — 둘러싸인 자리를 탭하면 면이 되고, 면을 탭하면 없어진다(토글).
             **자동으로 안 만든다** — 닫힌 루프가 생겼다고 면이 아니다. -->
        <button id="btn-face" class="t tool" title="면 — 둘러싸인 자리를 탭한다(다시 탭하면 없앤다)" aria-label="면">
          <svg width="26" height="32" viewBox="0 0 26 32">
            <path d="M4 21 10 8l12 3-5 13z" fill="#8d8880" fill-opacity=".26"
                  stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
        </button>

        <!-- 굵기 — **숫자가 없다.** 막대를 위아래로 끌면 그 자리에 그 굵기의 선이 그려진다(4-f).
             연필일 때는 안 뜬다: 연필의 굵기는 심이 정하고 그 조절은 연필 몸통에 있다(4-e). -->
        <div id="thick" style="cursor:ns-resize;touch-action:none;display:none">
          <svg width="26" height="86" viewBox="0 0 26 86">
            <line id="thick-line" x1="3" y1="43" x2="23" y2="43" stroke="#3c3831" stroke-width="1.5" />
            <circle id="thick-dot" cx="13" cy="43" r="6" fill="none" stroke="#3c3831" stroke-width="1" style="display:none" />
          </svg>
        </div>

        <div class="bar-gap"></div>

        <details class="pane" id="pane-file">
          <summary class="t" title="파일">
            <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M2.6 4.6h4.6l1.4 1.8h7.8v8.4H2.6z" />
            </svg>
          </summary>
          <div>
            <button id="btn-save" title=".brnl 저장">저장</button>
            <button id="btn-open" title=".brnl 열기">열기</button>
            <button id="btn-obj" title="OBJ 내보내기">OBJ 내보내기</button>
            <button id="btn-gltf" title="glTF 내보내기">glTF 내보내기</button>
            <button id="btn-clear" title="전부 지우고 처음부터 — 확인을 받는다">비우기</button>
          </div>
        </details>
        <details class="pane" id="pane-settings">
          <summary class="t" title="설정">
            <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.3">
              <circle cx="9.5" cy="9.5" r="2.6" />
              <path d="M9.5 2.4v2M9.5 14.6v2M2.4 9.5h2M14.6 9.5h2M4.5 4.5l1.4 1.4M13.1 13.1l1.4 1.4M14.5 4.5l-1.4 1.4M5.9 13.1l-1.4 1.4" />
            </svg>
          </summary>
          <div>
            <div class="head">오스냅</div>
            <div id="osnap-kinds" style="display:flex;flex-direction:column;gap:2px"></div>
            <label>반경 <input id="osnap-radius" type="range" min="4" max="20" step="1" style="width:80px"></label>
            <div class="head" style="margin-top:6px">표시</div>
            <label><input id="chk-grid" type="checkbox"> 지면 격자</label>
          </div>
        </details>
      </div>
    </div>
    <input id="file-open" type="file" accept=".brnl,application/json" style="display:none">
  </div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
