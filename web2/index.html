<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!-- 설치 표시줄 색 — 매니페스트 theme_color와 같은 값(#f5f3ee = --paper) -->
  <meta name="theme-color" content="#f5f3ee" />
  <!-- iOS 보험(web2-09 지시 1) — iOS 16.4 미만은 매니페스트 display를 안 읽는다.
       ⚠ 실기기가 안드로이드(MovinkPad)라 iOS는 **확인 못 했다** — 선언만 실었다. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Brunelleschi</title>
  <!-- 매니페스트·아이콘은 web2의 것이다(web2-08이 교체, web2-09 지시 0이 커밋).
       start_url `./`와 주소는 옛 앱(web/) 때 그대로라 설치된 PWA가 이 화면으로 들어온다. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    /* ── 그리기 도구의 UI (지시 4) ───────────────────────────────────────
       박스도 테두리도 없다. 요소만 둔다(4-a). 색은 회색조 하나이고 강조는 안 쓴다 —
       선택은 색이 아니라 **위치와 크기**로 보인다(4-d, 프로크리에이트 선례).
       그림이 주인공이므로 UI는 물러난다(4-c). */
    :root {
      --paper: #f5f3ee;
      --ui: #8d8880;        /* 안 고른 도구 — 물러나 있다 */
      --ui-faint: #b8b3ab;
      /* ── 세로바 크기의 단일 출처(web2-12 3번) ─────────────────────────────
         web2-10이 1.5배로 키울 때 값이 svg 속성마다 흩어져 시점·치수 버튼(20px)이
         빠졌다 — 배수는 여기 하나다. 아이콘 크기는 기준 높이 × 이 배수(아래 .ico-*).
         누름 여유(--hit-pad 3px)는 보이는 크기를 안 바꾸고 닿는 넓이만 키운다(관측 ②).
         ⚠ 두 «간격»을 가른다(2차 리뷰어 [6]의 혼동 자리): --btn-gap(1px)은 **버튼 사이
         flex gap**이고(종전 9px의 자리 — 시각 간격은 gap+2×pad=7px로 종전과 같은 대역),
         .bar-gap(10px)은 **그룹 사이 여백**이다(종전 21px → 10px). 줄인 대가는 높이
         예산이다: 요소가 늘어(시점 묶음 편입·연필통) 800px 화면에 들어가야 했다 —
         «간격을 늘린다» 선택지(지시 3)는 겹침이 0이라 발화 조건이 없었다(겹침은 흐름
         배치의 구성 보장 — 늘릴 이유는 겹침이지 여백이 아니다).
         겹침 0은 흐름 배치가 구성으로 보장한다(패딩은 흐름 안이다) — 선택 확대는
         svg에만 걸어(아래 .tool.on svg) 누름 상자를 안 건드린다. e2e sidebar.spec가
         크기 대역·오른쪽 정렬·쌍별 겹침 0을 잰다. */
      --ui-scale: 1.5;
      --hit-pad: 3px;
      --btn-gap: 1px;
    }
    /* touch-action을 **뿌리에도** 건다(web2-09 지시 2). 모든 요소가 #app의 자손이라
       유효 사슬에는 이미 none이 들어 있지만, 그 한 겹이 규칙 하나에 걸려 있었다 —
       뿌리 겹은 #app 쪽이 지워져도 브라우저 핀치·이중 탭 확대를 막는다.
       ⚠ 실기기 증상(핀치가 브라우저 줌)은 헤드리스에서 재현이 안 됐다 — 선언 두 겹을
       다 벗겨도 합성 핀치가 줌을 못 낸다(계측기 한계). 남는 후보는 선언을 설계상
       이기는 축(안드로이드 접근성 「강제 확대」·비-크롬 브라우저)이고 실기기에서 가른다. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); touch-action: none; }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { position: absolute; inset: 0; display: block; }
    #ink { z-index: 2; }
    #gl { z-index: 1; }
    /* brush 렌더러(web2-11 2부) — gl 위·ink 아래. 입력은 ink가 받으므로 이 겹은 눌리지 않는다. */
    #brushc { z-index: 1; pointer-events: none; }

    /* 알림 — 최상단 한 줄. 박스 없음. **오류가 있을 때만 뜬다**(4-b). 선택은 밑줄 단어. */
    #notice {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      font: 13px/1.8 system-ui, sans-serif; text-align: center;
      color: #6b665f; pointer-events: none; height: 24px;
    }
    #notice u { pointer-events: auto; cursor: pointer; }

    /* 시점 묶음(홈·시점 저장·명명된 뷰·치수) — **세로바 안으로 들어왔다**(web2-12 3번).
       web2-10이 겹침을 피하려 둘째 열(right:54)로 뺐던 것이 「크기가 안 맞고 오른쪽에
       정렬되지 않는다」는 관측을 낳았다 — 같은 흐름(flex) 안에 두면 겹침은 구성으로
       사라지고 오른쪽 세로축이 하나로 선다. */
    #viewbar { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }
    #views { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }

    /* 우측 세로바 하나 — 위: 시점·치수 · 실행취소 · 가운데: 도구·굵기 · 아래: 파일·설정(접힘).
       좌측과 하단은 비운다(4-i). */
    /* 크기의 단일 출처는 :root의 --ui-scale·--hit-pad·--bar-gap이다(web2-12 3번).
       ⚠ align-items는 **flex-end**다 — 폭이 다른 요소(도구 39px ↔ 아이콘 30px)가 섞이면
       중앙 정렬은 오른쪽 정렬이 아니다(관측 ①의 절반이 이것이었다). */
    /* 상단 고정(web2-12 3번) — 가운데 고정이던 초판은 요소가 늘며 **아래가 빌드 식별자
       (우하단 z-12 — 배포 판정자)를 덮었다**(e2e가 잡았다: 설정 요약 클릭을 가로챔).
       위에 붙이면 남는 여백이 전부 아래로 가 그 모서리가 비고, 화면이 커지면(실기기)
       더 여유롭다. */
    #sidebar {
      position: fixed; top: 12px; right: 2px;
      z-index: 10; display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end;
    }
    #sidebar-body { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }
    #sidebar.folded #sidebar-body { display: none; }
    .bar-gap { height: 10px; }

    /* 눌리는 것 전부의 바탕 — 배경도 테두리도 라운드도 없다(4-a).
       패딩 = 투명한 누름 여유(3번 관측 ②) — 보이는 크기는 svg가, 닿는 넓이는 이것이 정한다.
       흐름(flex) 안이라 이웃과 절대 안 겹친다(겹침 0의 구성적 보장 — e2e가 쌍별로 잰다). */
    .t {
      background: none; border: 0; border-radius: 0; padding: var(--hit-pad); margin: 0;
      display: block; cursor: pointer; color: var(--ui);
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s ease;
      opacity: .62;
    }
    .t svg { display: block; transition: transform .12s ease; }
    .t:hover { opacity: .85; }
    /* 아이콘 크기 — 기준 높이 × --ui-scale(단일 출처). width는 viewBox 비례(auto). */
    .ico-s  svg { height: calc(18px * var(--ui-scale)); width: auto; }  /* 접기 토글 */
    .ico-m  svg { height: calc(20px * var(--ui-scale)); width: auto; }  /* 실행취소·시점·치수·질감 */
    .ico-f  svg { height: calc(19px * var(--ui-scale)); width: auto; }  /* 파일·설정 */
    .ico-h  svg { height: calc(32px * var(--ui-scale)); width: auto; }  /* 지우개·면 */
    .ico-t  svg { height: calc(62px * var(--ui-scale)); width: auto; }  /* (옛) 세로 연필·펜 */
    /* 연필통(web2-12 6번) — 가로로 누운 행. 진하기 순으로 쌓인다. */
    #tray { display: flex; flex-direction: column; gap: var(--btn-gap); align-items: flex-end; }
    .trow svg { height: calc(15px * var(--ui-scale)); width: auto; }
    /* 굵기 막대 — **세로바 흐름 밖**(왼쪽 옆 고정. web2-12 3번): 흐름 안에 두면 펜을
       고른 순간 막대 높이(129px)가 세로바를 화면 밖으로 민다 — 자리 실측이 잡은 잠복
       결함(사람 관측 「화면 높이를 넘지 않는지」의 실제 사례). e2e가 펜 상태로도 잰다. */
    #thick {
      position: fixed; right: 112px; top: 50%; transform: translateY(-50%); z-index: 9;
    }
    /* **선택된 도구가 앞으로 나온다** — 강조 박스가 아니라 위치와 크기다(4-d).
       ⚠ 변형은 **svg에만** 건다(web2-12 3번) — 버튼 상자에 걸면 누름 사각형이 이웃을
       파고들어 겹침 0이 깨진다. 시각은 나오고 누름 자리는 제자리다. */
    .tool.on { opacity: 1; }
    .tool.on svg { transform: translateX(-10px) scale(1.14); }
    .tool { touch-action: none; }

    /* 파일·설정 — 접힌 채로 있고, 펴면 아주 옅은 바탕만 깐다(4-a: 「배경이 필요하면 아주 옅게」) */
    /* ⚠ **화면 밖으로 안 나가게 아래에 붙인다.** `position:absolute`로 요약 옆에 흘려 두었더니
       세로바가 화면 가운데에 있어 설정 패널(열 줄)이 **아래로 삐져나갔다** — 「지면 격자」
       체크박스가 뷰포트 밖(y=793 / 높이 720)에 있어 눌리지 않았다(2026-08-21 e2e가 잡았다).
       파일·설정은 세로바의 «아래» 묶음이므로(4-i) 우하단 고정이 자리와도 맞는다. */
    details.pane > div {
      position: fixed; right: 54px; bottom: 10px; z-index: 11; /* 세로바가 39px로 넓어짐(지시 5) */
      display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; white-space: nowrap;
      max-height: calc(100vh - 20px); overflow-y: auto;
      /* ⚠ 터치 스크롤은 **막힌 채로 뒀다** — 유효 사슬이 수리 전에도 none이었고(전 요소가
         #app 자손) 「패널을 스크롤 못 한다」는 관측이 없다. 관측 없이 pan-y로 푸는 것은
         근거 없는 넓힘이다(A-3 · 2차 리뷰어 [15]가 초판의 pan-y를 잡았다 — AS-C26).
         휠 스크롤은 touch-action과 무관해 데스크톱은 그대로 돈다. */
      font: 12px system-ui, sans-serif; color: #4a463f;
    }
    /* 뷰 썸네일 팝오버(web2-12 5번) — 뷰 버튼 왼쪽에 펼쳐진다. 눈으로 보고 고른다. */
    #views-pop {
      position: fixed; z-index: 30;
      background: rgba(252,251,248,.97); box-shadow: 0 1px 10px rgba(0,0,0,.12);
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
      max-height: calc(100vh - 24px); overflow-y: auto;
    }
    #views-pop .vrow { display: flex; align-items: flex-start; gap: 4px; }
    #views-pop .vpick {
      background: none; border: 0; padding: 0; cursor: pointer; display: block;
      font: 13px system-ui, sans-serif; color: #4a463f;
    }
    #views-pop .vpick img { display: block; box-shadow: 0 0 0 1px #e5e0d6; }
    #views-pop .vpick:hover img { box-shadow: 0 0 0 1px #8d8880; }
    #views-pop .vdel {
      background: none; border: 0; cursor: pointer; padding: 2px 4px;
      font: 12px system-ui, sans-serif; color: #a89f8e;
    }
    #views-pop .vdel:hover { color: #4a463f; }

    /* 버튼 곁 확인(web2-12 4번) — 누른 버튼의 왼쪽 옆. 다른 패널과 같은 옅은 바탕(4-a). */
    .confirm-pop {
      position: fixed; z-index: 30;
      background: rgba(252,251,248,.97); box-shadow: 0 1px 10px rgba(0,0,0,.12);
      padding: 9px 12px; font: 13px system-ui, sans-serif; color: #4a463f;
      display: flex; gap: 12px; align-items: center; white-space: nowrap;
    }
    .confirm-pop u { cursor: pointer; }
    details.pane summary { list-style: none; cursor: pointer; }
    details.pane summary::-webkit-details-marker { display: none; }
    .pane button {
      background: none; border: 0; padding: 5px 0; text-align: left; cursor: pointer;
      font: 13px system-ui, sans-serif; color: #4a463f; /* 펜으로 누르는 줄 — 닿는 높이 ≈ 27px(지시 5) */
    }
    .pane button:hover { color: #111; }
    .pane label { display: flex; align-items: center; gap: 6px; }
    .pane .head { color: var(--ui-faint); letter-spacing: .04em; }

    /* 치수 리본(web2-08 지시 4-3) — 우측, 접힌다. 옅은 바탕(4-a 「배경이 필요하면 아주 옅게」) */
    #dimpanel {
      position: fixed; right: 96px; top: 96px; z-index: 11; /* 시점바(right:54)의 왼쪽 — 열면 토글을 안 덮는다 */
      display: flex; flex-direction: column; gap: 7px; width: 208px;
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; font: 12px system-ui, sans-serif; color: #4a463f;
    }
    #dimpanel.folded { display: none; }
    #dimpanel .head { color: var(--ui-faint); letter-spacing: .04em; }
    #dim-live { font: 20px/1.2 system-ui, sans-serif; color: #3c3831; min-height: 24px; }
    /* ⚠ 전역 canvas 규칙(absolute·inset 0)이 여기도 걸린다 — 흐름 안으로 되돌린다.
       처음에 이것이 없어서 필기 칸이 패널 좌상단에 겹쳐 제목·숫자를 덮었다(스크린샷이 잡았다). */
    #dim-ink { position: static; inset: auto; width: 184px; height: 72px; background: #fff;
      box-shadow: inset 0 0 0 1px #e5e0d6; touch-action: none; cursor: crosshair; }
    #dimpanel button {
      background: none; border: 0; padding: 2px 0; cursor: pointer;
      font: 12px system-ui, sans-serif; color: #4a463f; text-decoration: underline;
    }
    #dimpanel label { display: flex; align-items: center; gap: 6px; }
    #dimpanel .on { color: #1a6ac2; }
    #dim-read { min-width: 56px; font: 13px monospace; color: #3c3831; }
    /* 숫자 키패드(web2-10 지시 8-a) — **확정 경로**. 항상 펴져 있고 인식을 안 거친다.
       치수는 첫 입력이 scaleRef를 정하는 자리라(3이 8로 읽히면 전체 실척이 조용히 틀린다)
       확률적 입력(필기·음성)만으로는 안 된다 — A-3 「조용히 틀린 배치를 만들지 않는다」.
       키 크기는 지시 5의 대역(닿는 높이 ≥ 27px)에 맞춘다 — 펜으로 누르는 판이다. */
    #pad-read { font: 17px/1.4 monospace; color: #3c3831; min-height: 24px; }
    /* 행 높이는 격자가 정한다 — 버튼 height를 34로 고정하면 «적용»의 두 줄 스팬이 안 는다
       (실측 34로 걸렸다 — 팔이 잡았다). */
    #pad-keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 34px; gap: 5px; }
    #pad-keys button {
      background: none; border: 0; cursor: pointer; height: 100%; width: 100%;
      font: 16px system-ui, sans-serif; color: #3c3831; text-decoration: none;
      box-shadow: inset 0 0 0 1px #e5e0d6; padding: 0;
    }
    #pad-keys button:hover { box-shadow: inset 0 0 0 1px #b8b3ab; }

    /* ── 자체 로딩화면(web2-10 지시 2·3) ─────────────────────────────────
       크롬이 매니페스트로 만드는 스플래시는 PNG 아이콘을 확대해 흐리다 — 그 답이
       인라인 SVG다(어떤 밀도에서도 선명하다). **인라인이어야 한다**: JS 번들을
       기다리면 빈 화면이 먼저 번쩍인다. 배경은 매니페스트 background_color와 같은
       #f5f3ee — 크롬 스플래시에서 이 화면으로 넘어올 때 안 튄다.
       pointer-events:none — 이 겹이 떠 있는 동안에도 펜 입력을 안 막는다.
       ⚠ SVG의 클래스는 전부 #boot 아래로 스코프한다 — 인라인 SVG의 <style>은
       문서 전역이라 앱 쪽과 충돌할 수 있다(그래서 icon.svg의 <style>을 안 가져왔다). */
    #boot {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f5f3ee; pointer-events: none;
      transition: opacity .25s ease;
    }
    #boot.gone { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
    #boot svg { width: min(46vmin, 300px); height: auto; display: block; }
    /* 크레딧 색 — 이 저장소의 무채색 판정(채널 차 ≤ 12) 안의 회색으로.
       --ui(#8d8880)는 차 13이라 그 기준 밖이다(1차 리뷰어 [10] — 「무채색」을 한 뜻으로). */
    #boot .credit {
      margin-top: 22px; text-align: center;

    /* 빌드 식별자 — 배포 판정자(PITFALLS #58). 물러나 있되 **눌린다**(web2-10 지시 4):
       누르면 위 진단 패널이 펴진다. 태블릿에는 콘솔이 없어 이 길이 유일한 판독 통로다. */
    #buildid {
      position: fixed; right: 6px; bottom: 4px; z-index: 12;
      font: 10px monospace; color: #c9c4bc; cursor: pointer;
      /* 펜으로 누르기엔 글자가 얇다 — 보이는 크기는 그대로 두고 닿는 넓이만 키운다 */
      padding: 8px 4px 4px 8px;
    }
    /* 진단 패널(web2-10 지시 4) — 전부 한 화면에. 다른 패널과 같은 옅은 바탕(4-a).

       #buildid는 별개 요소). 줄이 늘어 치수 필기 칸(#dim-ink)까지 자라면 포인터를
       삼켜 필기가 조용히 무시됐다(web2-14 e224d82부터 — web2-16 1부가 표식으로 확인).

       대가: 패널 글자를 마우스로 긁어 복사할 수 없다 — 태블릿(주 기기)에는 없던 길이다. */
    #diagpanel {
      position: fixed; right: 6px; bottom: 26px; z-index: 12;
      max-width: min(86vw, 560px);
      background: rgba(252,251,248,.94); box-shadow: 0 1px 10px rgba(0,0,0,.07);
      padding: 10px 12px; font: 11px/1.7 monospace; color: #4a463f;
      overflow-wrap: anywhere; pointer-events: none;
    }
    #diagpanel .k { color: #a89f8e; display: inline-block; min-width: 118px; }
  </style>

        <button id="btn-eraser-ink" class="t tool ico-h" title="펜 지우개 — 잉크만 지운다" aria-label="펜 지우개">
          <svg width="39" height="48" viewBox="0 0 26 32">
            <path d="M6 20 13 6h7l-7 14z" fill="#e4ddcd" stroke="#8b857a" stroke-width="1" />
            <path d="M6 20h7v6H6z" fill="#3a3833" stroke="#8b857a" stroke-width="1" />
            <path d="M13 20h7l-7 6z" fill="#2b2925" stroke="#8b857a" stroke-width="1" />
          </svg>
        </button>

        <!-- 면 — 둘러싸인 자리를 탭하면 면이 되고, 면을 탭하면 없어진다(토글).
             **자동으로 안 만든다** — 닫힌 루프가 생겼다고 면이 아니다. -->
        <!-- ⛔ 종이 질감 토글(btn-brush)은 web2-13 3-c로 **설정 패널로 옮겨졌다** —
             평가용 비교 스위치인데 도구들 사이에 서 있어 실수로 눌렸다(사람이 실제로
             눌러 「잉크가 사라졌다」로 오인). 옛 자리 주석(web2-11 2-b «설정에 묻지
             않고 여기 둔다»)은 그 관측으로 뒤집혔다(#65 — 근거를 현재 사실로). -->
        <button id="btn-face" class="t tool ico-h" title="면 — 둘러싸인 자리를 탭한다(다시 탭하면 없앤다)" aria-label="면">
          <svg width="39" height="48" viewBox="0 0 26 32">
            <path d="M4 21 10 8l12 3-5 13z" fill="#8d8880" fill-opacity=".26"
                  stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
        </button>

        <!-- 굵기 — **숫자가 없다.** 막대를 위아래로 끌면 그 자리에 그 굵기의 선이 그려진다(4-f).
             연필일 때는 안 뜬다: 연필의 굵기는 심이 정하고 그 조절은 연필 몸통에 있다(4-e). -->
        <div id="thick" style="cursor:ns-resize;touch-action:none;display:none">
          <svg width="39" height="129" viewBox="0 0 39 129">
            <line id="thick-line" x1="4.5" y1="64.5" x2="34.5" y2="64.5" stroke="#3c3831" stroke-width="1.5" />
            <circle id="thick-dot" cx="19.5" cy="64.5" r="9" fill="none" stroke="#3c3831" stroke-width="1" style="display:none" />
          </svg>
        </div>

        <div class="bar-gap"></div>

        <details class="pane" id="pane-file">
          <summary class="t ico-f" title="파일">
            <svg width="28" height="28" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M2.6 4.6h4.6l1.4 1.8h7.8v8.4H2.6z" />
            </svg>
          </summary>
          <!-- 「저장/열기」와 「내보내기」를 이름에서 가른다(web2-10 지시 5) —
               .brnl은 되돌아오는 원본이고 OBJ/glTF는 나가기만 한다. 사람이 「내보내기가
               있으니 불러오기도 필요하다」고 한 것은 그 둘을 같은 것으로 읽었다는 관측이다. -->
          <div>
            <div class="head">원본 .brnl — 다시 연다</div>
            <button id="btn-save" title=".brnl 저장 — 이 앱에서 다시 열 수 있는 원본">저장</button>
            <button id="btn-open" title=".brnl 열기">열기</button>
            <div class="head" style="margin-top:6px">내보내기 — 나가기만 한다</div>
            <button id="btn-obj" title="OBJ 내보내기 — 다른 앱용. 이 앱으로 못 되돌아온다">OBJ</button>
            <button id="btn-gltf" title="glTF 내보내기 — 다른 앱용. 이 앱으로 못 되돌아온다">glTF</button>
            <div style="height:6px"></div>
            <button id="btn-clear" title="전부 지우고 처음부터 — 확인을 받는다">비우기</button>
          </div>
        </details>
        <details class="pane" id="pane-settings">
          <summary class="t ico-f" title="설정">
            <svg width="28" height="28" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.3">
              <circle cx="9.5" cy="9.5" r="2.6" />
              <path d="M9.5 2.4v2M9.5 14.6v2M2.4 9.5h2M14.6 9.5h2M4.5 4.5l1.4 1.4M13.1 13.1l1.4 1.4M14.5 4.5l-1.4 1.4M5.9 13.1l-1.4 1.4" />
            </svg>
          </summary>
          <div>
            <div class="head">오스냅</div>
            <div id="osnap-kinds" style="display:flex;flex-direction:column;gap:2px"></div>
            <label>반경 <input id="osnap-radius" type="range" min="4" max="20" step="1" style="width:80px"></label>
            <div class="head" style="margin-top:6px">표시</div>
            <label><input id="chk-horizon" type="checkbox" checked> 지평선</label>
            <label><input id="chk-grid" type="checkbox"> 지면 격자</label>
            <!-- web2-13 3-a — 끄면 종전 동작(대기 획을 항상 그리되 흐리게). 실기기 판정용 되돌림(A-4). -->
            <label><input id="chk-waitfade" type="checkbox" checked> 대기 획은 그린 시점에서만</label>
            <div class="head" style="margin-top:6px">렌더러</div>
            <!-- web2-13 3-c — 세로바에서 옮겨 온 평가용 비교 스위치(btn-brush id 유지 — 배선·팔이 그 이름을 본다) -->
            <button id="btn-brush" title="종이 질감 — 획을 brush 렌더러로 (다시 누르면 종전 렌더러)">종이 질감</button>
            <div class="head" style="margin-top:6px">3D 경로</div>
            <!-- web2-13 4부 자립 깃발 → web2-14 1번에서 기본 켜짐(사람 판정). 끄면 옛 사슬 경로(A-4). 지금 경로는 진단 패널이 보인다. -->
            <label><input id="chk-own3d" type="checkbox" checked> 획이 위치를 소유한다 (개정 3)</label>
          </div>
        </details>
      </div>
    </div>
    <input id="file-open" type="file" accept=".brnl,application/json" style="display:none">
  </div>
  <script>
    // 브라우저 줌 보험(web2-09 지시 2) — 뷰포트 메타와 touch-action이 **무시되는** 환경용.
    // iOS 사파리는 user-scalable=no를 안 읽고, 안드로이드 접근성 「강제 확대」는 메타를 이긴다.
    // 두 손가락 touchmove만 막는다 — 앱의 조작은 Pointer Events로 받으므로(input.ts)
    // 파생 터치 이벤트의 preventDefault가 펜·한 손가락·앱의 두 손가락 팬줌을 안 건드린다.
    // (한 손가락 touchstart는 막지 않는다 — 그것을 막으면 click이 죽어 단추가 안 눌린다)
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault()
    }, { passive: false })
    // 사파리 전용 핀치 채널 — gesture*는 사파리에만 있다. 실기기(안드로이드)로는 확인 못 한다.
    for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
      document.addEventListener(t, (e) => e.preventDefault())
    // 데스크톱의 브라우저 줌(Ctrl+휠 = 트랙패드 핀치 포함). 캔버스 위에서는 어차피
    // 앱 휠 핸들러가 전부 preventDefault한다(input.ts) — 이 줄은 그 바깥(패널·단추)을 덮는다.
    window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault() }, { passive: false })
  </script>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
