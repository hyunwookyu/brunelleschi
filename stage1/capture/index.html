<!doctype html>
<meta charset="utf-8">
<title>SKETCH2SPACE — ink capture (stage1)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root{--bg:#fafafa;--ink:#111}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  #bar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;gap:6px;align-items:center;
       padding:0 8px;background:#fff;border-bottom:1px solid #ddd;z-index:10;flex-wrap:wrap}
  .pen{width:26px;height:26px;border-radius:50%;border:2px solid #0000;cursor:pointer}
  .pen.sel{border-color:#000}
  button{height:30px;padding:0 10px;border:1px solid #ccc;background:#fff;border-radius:6px}
  #c{position:absolute;top:44px;left:0;touch-action:none;background:#fff}
  small{color:#666}
</style>
<div id="bar">
  <span class="pen sel" data-ch="mass"  style="background:#111"  title="검정=매스 윤곽"></span>
  <span class="pen"     data-ch="circ"  style="background:#e11"  title="빨강=동선"></span>
  <span class="pen"     data-ch="axis"  style="background:#16c"  title="파랑=축·그리드"></span>
  <span class="pen"     data-ch="note"  style="background:#1a1"  title="초록=주석"></span>
  <button id="undo">undo</button>
  <button id="clear">clear</button>
  <button id="save">export JSON</button>
  <small id="stat">frame f1 · pen mass · 0 strokes</small>
</div>
<canvas id="c"></canvas>
<script>
// §4.1 스트로크 포맷 {"points":[[x,y,t,p]],"pen":id,"frame":id}; §4.3 펜 채널
const c = document.getElementById('c'), ctx = c.getContext('2d');
const COLORS = {mass:'#111',circ:'#e11',axis:'#16c',note:'#1a1'};
let pen = 'mass', strokes = [], cur = null, frame = 'f1';
function resize(){ c.width=innerWidth; c.height=innerHeight-44; redraw(); }
addEventListener('resize', resize);
function redraw(){
  ctx.clearRect(0,0,c.width,c.height);
  for(const s of strokes) drawStroke(s);
  if(cur) drawStroke(cur);
  document.getElementById('stat').textContent =
    `frame ${frame} · pen ${pen} · ${strokes.length} strokes`;
}
function drawStroke(s){
  const pts=s.points; if(pts.length<2) return;
  ctx.strokeStyle=COLORS[s.pen]||'#111'; ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=1;i<pts.length;i++){
    const p=pts[i], q=pts[i-1];
    ctx.beginPath(); ctx.lineWidth=0.5+3*(p[3]||0.5); // 필압→선폭
    ctx.moveTo(q[0],q[1]); ctx.lineTo(p[0],p[1]); ctx.stroke();
  }
}
c.addEventListener('pointerdown',e=>{
  c.setPointerCapture(e.pointerId);
  cur={points:[[e.offsetX,e.offsetY,e.timeStamp,e.pressure]],pen,frame,
       tilt:[e.tiltX,e.tiltY],ptype:e.pointerType};
});
c.addEventListener('pointermove',e=>{
  if(!cur) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of evs) cur.points.push([ev.offsetX,ev.offsetY,ev.timeStamp,ev.pressure]);
  redraw();
});
function end(){ if(cur){ if(cur.points.length>1) strokes.push(cur); cur=null; redraw(); } }
c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
document.querySelectorAll('.pen').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.pen').forEach(p=>p.classList.remove('sel'));
  el.classList.add('sel'); pen=el.dataset.ch; redraw();
});
document.getElementById('undo').onclick=()=>{strokes.pop();redraw();};
document.getElementById('clear').onclick=()=>{strokes=[];redraw();};
document.getElementById('save').onclick=()=>{
  const blob=new Blob([JSON.stringify({frame,w:c.width,h:c.height,strokes},null,0)],
                      {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`sketch_${frame}_${Date.now()}.json`; a.click();
};
resize();
</script>
