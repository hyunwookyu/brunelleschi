<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>투시 스케치 3D</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1a99aa">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <!-- iOS의 '홈 화면에 추가'는 SVG를 읽지 않는다 — PNG가 없으면 아이콘이 안 뜬다(S-9). -->
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sketch3D">
  <style>
    *{margin:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
    html,body{height:100%;font:14px system-ui,sans-serif;background:#f6f6f6;color:#111;overflow:hidden}
    #panels{position:absolute;inset:0 0 48px 0;display:grid;grid-template-columns:1fr 1fr 300px}
    #view{position:relative;overflow:hidden;background:#f2f4f6;border-left:1px solid #e2e2e2}
    #view canvas{display:block}
    #ink3d{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none;
      pointer-events:none;cursor:crosshair}
    #ink3d.on{pointer-events:auto}
    #viewtools{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:4px}
    #viewtools button{height:28px;padding:0 10px;border:1px solid #c8c8c8;background:rgba(255,255,255,.9);
      border-radius:6px;cursor:pointer;font-size:12px}
    #viewtools button.on{background:#111;color:#fff;border-color:transparent}
    #viewlabel{position:absolute;left:10px;top:10px;z-index:2;font-size:12px;color:#6b7780;
      background:rgba(255,255,255,.82);border-radius:5px;padding:3px 7px;pointer-events:none}
    #left{position:relative;background:#fff;overflow:hidden}
    #ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
    #side{position:relative;overflow-y:auto;background:#fbfbfb;border-left:1px solid #e2e2e2;padding:12px}

    /* 도구 — 무엇을 찍는 중인지가 보여야 한다 */
    #tools{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;max-width:70%}
    #tools button{height:30px;padding:0 10px;border:1px solid #c8c8c8;background:#fff;border-radius:6px;
      cursor:pointer;font-size:13px}
    #tools button.on{color:#fff;border-color:transparent}
    #tools button[data-t="vp0"].on{background:#c0392b}
    #tools button[data-t="vp1"].on{background:#1e8449}
    #tools button[data-t="vp2"].on{background:#2471a3}
    #tools button[data-t="horizon"].on{background:#666}
    #tools button[data-t="adjust"].on{background:#6c3483}
    #tools button[data-t="draw"].on{background:#111}
    #tools button[data-t="edit"].on{background:#b9770e}
    #tools button[data-t="erase"].on{background:#7b241c}
    #tools .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

    /* 상태 = 이론서 5.3 자유도 회계 */
    #status .hdr{font-size:15px;margin-bottom:8px}
    #status .lock{font-size:11px;background:#333;color:#fff;border-radius:3px;padding:1px 5px}
    #status .ax{margin:3px 0;font-size:13px}
    #status .ax i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
    #status .f{margin:8px 0 4px;font-size:13px;font-weight:600}
    #status .dim{color:#777;font-size:12px;font-weight:400}
    #status .assume{font-style:italic}
    #status .need{color:#b06000}
    #status .hint{color:#555;font-size:12px;margin-top:4px;line-height:1.45}
    #status .warn{color:#8a5200;background:#fff6e5;border:1px solid #e8c07a;border-radius:5px;
      padding:5px 7px;margin-top:6px;font-size:12px;line-height:1.4}
    #status .error{color:#8c1d13;background:#fdecea;border:1px solid #e6a49c;border-radius:5px;
      padding:5px 7px;margin-top:6px;font-size:12px;line-height:1.4}

    .sec{margin-top:14px;padding-top:12px;border-top:1px solid #e6e6e6}
    .sec h3{font-size:12px;color:#666;font-weight:600;margin-bottom:7px;letter-spacing:.02em}
    #presets{display:flex;flex-direction:column;gap:4px}
    #presets button{text-align:left;padding:6px 9px;border:1px solid #d5d5d5;background:#fff;
      border-radius:6px;cursor:pointer;font-size:12px}
    #presets button small{display:block;color:#888;margin-top:1px}
    #strokes{font-size:13px;line-height:1.5}
    #strokes .hint{color:#666;font-size:12px;margin-top:4px;line-height:1.45}
    #axispick{display:none;gap:4px;flex-wrap:wrap;margin-top:8px}
    #fix{margin-top:8px;font-size:12px;color:#444}
    #fix .row{display:flex;align-items:center;gap:6px;margin-top:5px}
    #fix button{height:26px;padding:0 8px;border:1px solid #c8c8c8;background:#fff;
      border-radius:6px;cursor:pointer;font-size:12px}
    #fix button.on{background:#b9770e;color:#fff;border-color:transparent}
    #fix input[type=range]{flex:1;min-width:90px}
    #axispick button{height:28px;padding:0 9px;border:1px solid #c8c8c8;background:#fff;
      border-radius:6px;cursor:pointer;font-size:12px}
    #lensrow{display:flex;align-items:center;gap:8px}
    #lens{flex:1}
    #lensval{font-variant-numeric:tabular-nums;font-size:12px;color:#444;min-width:52px;text-align:right}

    #bar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;gap:8px;align-items:center;
      padding:0 12px;background:#fff;border-top:1px solid #ddd}
    #bar button{height:30px;padding:0 12px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer}
    #msg{color:#666;font-size:12px;margin-left:auto}
    #save{color:#8a8a8a;font-size:11px;margin-left:6px;font-variant-numeric:tabular-nums}
    /* 좌표 진단 — 닿는 자리와 그려지는 자리가 갈릴 때 즉시 원인을 가른다 */
    #diagbox{position:absolute;right:8px;bottom:56px;z-index:9;display:none;max-width:340px;
      background:rgba(20,22,24,.88);color:#eaeaea;font:11px/1.5 ui-monospace,Menlo,monospace;
      padding:8px 10px;border-radius:6px;white-space:pre;pointer-events:none}
    #diagbox.on{display:block}
    #diagbox b{color:#7fd1e0}
  </style>
</head>
<body>
  <div id="panels">
    <div id="left">
      <canvas id="ink"></canvas>
      <div id="tools">
        <button data-t="vp0" class="on"><span class="swatch" style="background:#c0392b"></span>축1</button>
        <button data-t="vp1"><span class="swatch" style="background:#1e8449"></span>축2</button>
        <button data-t="vp2"><span class="swatch" style="background:#2471a3"></span>축3</button>
        <button data-t="horizon">지평선</button>
        <button data-t="adjust" title="검출된 소실점의 가이드 선을 끌어 맞춥니다 — 그리드와 3D가 따라 움직입니다">소실점 조정</button>
        <button data-t="draw">그리기</button>
        <button data-t="edit" title="놓이지 않은 획을 골라 붙일 곳을 지정합니다">고치기</button>
        <button data-t="erase" title="누른 자리의 획을 지웁니다">지우개</button>
      </div>
    </div>
    <div id="view">
      <canvas id="ink3d"></canvas>
      <div id="viewlabel">3D — 드래그로 회전</div>
      <div id="viewtools">
        <button id="vt-orbit" class="on">회전</button>
        <button id="vt-draw">여기서 그리기</button>
        <button id="vt-fix" title="이 시점에서 못 놓은 획을 붙입니다">고치기</button>
      </div>
    </div>
    <div id="side">
      <div id="status"></div>
      <div class="sec">
        <h3>렌즈 (35mm 환산)</h3>
        <div id="lensrow">
          <input id="lens" type="range" min="14" max="85" step="1" value="35">
          <span id="lensval">35mm</span>
        </div>
      </div>
      <div class="sec">
        <h3>획</h3>
        <div id="strokes"></div>
        <div id="axispick"></div>
        <div id="fix"></div>
      </div>
      <div class="sec">
        <h3>프리셋</h3>
        <div id="presets"></div>
      </div>
    </div>
  </div>
  <div id="diagbox"></div>
  <div id="bar">
    <button id="undo" title="Ctrl+Z">실행 취소</button>
    <button id="redo" title="Ctrl+Shift+Z">다시 실행</button>
    <button id="draft" title="그린 획에서 소실점을 추정해 초안으로 놓습니다">소실점 추정</button>
      <button id="lock">카메라 잠금</button>
    <button id="reset">처음부터</button>
    <button id="export" title="실획 측정용 세션 JSON (AS-6·AS-12 재측정 입력)">획 내보내기</button>
    <button id="exp-obj" title="폴리라인 OBJ — 면은 없습니다(만들지 않는 도구입니다)">OBJ</button>
    <button id="exp-gltf" title="glTF 2.0 (LINE_STRIP). 버퍼가 파일 안에 들어갑니다">glTF</button>
    <button id="diag" title="포인터 좌표·캔버스 배율을 표시합니다(좌표 어긋남 진단)">진단</button>
    <span id="save" title="브라우저에 자동 저장됩니다(IndexedDB)"></span>
    <span id="msg">축1 소실점을 찍거나, 그 방향 선을 두 개 그으세요</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
