<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>투시 선 도구 (L)</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1a99aa">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <!-- iOS의 '홈 화면에 추가'는 SVG를 안 읽는다 — PNG가 없으면 아이콘이 안 뜬다 -->
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sketch3D">
  <style>
    /* §10.3 — 단일 뷰포트. 2D 잉크와 3D 씬이 같은 상자 안에 겹친다. */
    *{margin:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
    html,body{height:100%;font:14px system-ui,sans-serif;background:#fff;color:#111;overflow:hidden}
    #wrap{position:absolute;inset:0;display:flex;flex-direction:column}
    #frame{position:relative;flex:1;min-height:0;overflow:hidden}
    #stage{position:absolute;inset:0}
    #stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
    #ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
    #status{position:absolute;left:10px;top:10px;z-index:3;max-width:min(46ch,60%);
            background:rgba(255,255,255,.86);border:1px solid #e3e3e3;border-radius:8px;
            padding:8px 10px;line-height:1.55;pointer-events:none;backdrop-filter:blur(2px)}
    #status .hdr{font-size:13px;margin-bottom:2px}
    #status .lock{background:#111;color:#fff;border-radius:4px;padding:0 5px;font-size:11px}
    #status .dim{color:#888}
    #status .f{color:#2471a3}
    #status .warn{color:#b9770e}
    #status .error{color:#c0392b}
    #status .note{margin-top:4px;color:#444;border-top:1px solid #eee;padding-top:4px}
    #status b{font-weight:600}
    /* §6.2 승격 요약 — **눈에 띄어야 한다.** 승격은 품질을 올리고 배치를 줄이므로
       사용자가 되돌릴 이유가 실제로 있고(L-C.1), 자동 신호가 없어 이 표시가 유일한 판정 수단이다.
       ⚠ `#status`가 `pointer-events:none`이라 **여기서 되살려야** 재연결 버튼이 눌린다. */
    #status .promote{pointer-events:auto;margin:-8px -10px 8px;padding:8px 10px;
                     background:#fff6e5;border-bottom:1px solid #f0d9b0;
                     border-radius:8px 8px 0 0}
    #status .promote button{font:inherit;font-size:13px;padding:3px 9px;margin:3px 0;
                            border:1px solid #d4a95c;border-radius:5px;
                            background:#fff;color:#111;cursor:pointer}
    #bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:7px 10px;
         border-top:1px solid #e3e3e3;background:#fafafa;overflow-x:auto}
    #bar button{font:inherit;padding:5px 11px;border:1px solid #d4d4d4;border-radius:6px;
                background:#fff;color:#111;cursor:pointer;white-space:nowrap}
    #bar button.on{background:#111;color:#fff;border-color:#111}
    #bar button:disabled{opacity:.38;cursor:default}
    #bar .sep{width:1px;height:20px;background:#e0e0e0;flex:0 0 auto}
    /* §9.2 뷰 목록 — 라이노의 명명된 뷰를 따르되 **2D 획을 소유한다**. */
    #views{position:absolute;right:10px;top:10px;z-index:3;min-width:15ch;max-width:30ch;
           background:rgba(255,255,255,.86);border:1px solid #e3e3e3;border-radius:8px;
           padding:6px 8px;line-height:1.5;backdrop-filter:blur(2px)}
    #views .cap{font-size:12px;color:#888;margin-bottom:3px}
    #views .row{display:flex;gap:6px;align-items:center}
    #views .row + .row{margin-top:2px}
    #views .row button{font:inherit;font-size:13px;padding:2px 7px;border:1px solid #d4d4d4;
                       border-radius:5px;background:#fff;color:#111;cursor:pointer;
                       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
    #views .row button.on{background:#111;color:#fff;border-color:#111}
    #views .row .del{flex:0 0 auto;color:#c0392b;padding:2px 6px}
    #views .row .del:disabled{opacity:.3;cursor:default;color:#888}
    #views .n{color:#888;font-size:12px}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="frame">
      <div id="stage"></div>
      <canvas id="ink"></canvas>
      <div id="status"></div>
      <div id="views"></div>
    </div>
    <div id="bar"></div>
  </div>
  <script type="module" src="./src/mainL.ts"></script>
</body>
</html>
