<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Brunelleschi — 투시 선 도구</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1a99aa">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <!-- iOS의 '홈 화면에 추가'는 SVG를 안 읽는다 — PNG가 없으면 아이콘이 안 뜬다 -->
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sketch3D">
  <style>
    /* §10.3 — 단일 뷰포트. 2D 잉크와 3D 씬이 같은 상자 안에 겹친다. */
    *{margin:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
    html,body{height:100%;font:14px system-ui,sans-serif;background:#fff;color:#111;overflow:hidden}
    #wrap{position:absolute;inset:0;display:flex;flex-direction:column}
    #frame{position:relative;flex:1;min-height:0;overflow:hidden}
    #stage{position:absolute;inset:0}
    #stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
    #ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
    /* **알림은 화면 최상단 한 줄이다**(2026-08-20 18차 지시 f~i · D-L110).
       박스를 만들지 않는다 — 화면을 최대한 덜 가려야 한다.
       ⚠ **두 줄로 안 늘어난다**: `nowrap` + 말줄임이 "한 줄에 안 들어가면 문구를 줄인다"(지시 i)를
       코드로 강제한다. 평소에는 비어 있고(지시 g) `:empty`가 자리마저 없앤다. */
    #status{position:absolute;left:0;right:0;top:0;z-index:6;
            font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            color:#111;padding:7px 14px;pointer-events:none;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            background:linear-gradient(rgba(255,255,255,.94),rgba(255,255,255,.72) 70%,rgba(255,255,255,0))}
    #status:empty{display:none}
    #status b{font-weight:600}
    #status .dim{color:#888}
    /* **선택은 밑줄 친 단어다**(지시 f) — 캐드 명령행의 선례(A-3). 버튼 상자가 아니다. */
    #status u{pointer-events:auto;cursor:pointer;margin-left:16px;
              text-underline-offset:3px;text-decoration-thickness:1px}
    #status u:hover{color:#c0392b}
    #bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:7px 10px;
         border-top:1px solid #e3e3e3;background:#fafafa;overflow-x:auto}
    #bar button{font:inherit;padding:5px 11px;border:1px solid #d4d4d4;border-radius:6px;
                background:#fff;color:#111;cursor:pointer;white-space:nowrap}
    #bar button.on{background:#111;color:#fff;border-color:#111}
    #bar button:disabled{opacity:.38;cursor:default}
    #bar .sep{width:1px;height:20px;background:#e0e0e0;flex:0 0 auto}
    /* 4차 지시 6 — 하단바 재배치: 도구·채널 왼쪽 · 표시 토글 접이식 · 파일 오른쪽 */
    #bar .spacer{flex:1 1 auto}
    #bar .grp{font-size:11px;color:#9a9a9a;flex:0 0 auto;margin:0 1px 0 5px}
    #bar .folded{display:none}
    /* 궤도·확정 시점은 마우스 전용(지시 6-b) — 손가락 장치(아이패드)에서는 제스처가 대신한다 */
    @media (pointer: coarse){ #bar .mouse-only{display:none} }
    /* 5차 지시 6 — 프로크리에이트식 배치: 도구·채널은 상단 우측 묶음, 크기 슬라이더는 좌측 사이드바 */
    #tools{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;gap:6px;
           background:rgba(255,255,255,.9);border:1px solid #e3e3e3;border-radius:10px;padding:8px;
           backdrop-filter:blur(2px)}
    #tools .row{display:flex;gap:6px;justify-content:flex-end}
    #tools button{font:inherit;padding:5px 11px;border:1px solid #d4d4d4;border-radius:6px;
                  background:#fff;color:#111;cursor:pointer;white-space:nowrap}
    #tools button.on{background:#111;color:#fff;border-color:#111}
    #tools button:disabled{opacity:.38;cursor:default}
    #side{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:4;
          background:rgba(255,255,255,.9);border:1px solid #e3e3e3;border-radius:10px;
          padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
          backdrop-filter:blur(2px)}
    /* 세로 슬라이더 — writing-mode 미지원이면 가로로 떨어져도 동작은 같다 */
    #side input[type=range]{writing-mode:vertical-lr;direction:rtl;height:140px;width:26px}
    #side .val{font-size:11px;color:#666}
    #side.hidden{display:none}
    /* 6차 지시 1 — 3D 뷰 큐브: 우측 상단(도구 묶음 아래). 면/모서리/꼭짓점 = 절대 시점 스냅 ·
       드래그 = 연속 회전(수직축 고정) · 빈 곳 탭 = 가장 가까운 1점 */
    #cube{position:absolute;right:10px;top:118px;z-index:4;width:108px;height:108px;
          background:rgba(255,255,255,.9);border:1px solid #e3e3e3;border-radius:10px;
          touch-action:none;cursor:grab;backdrop-filter:blur(2px)}
    #cube.hidden{display:none}
    /* §9.2 뷰 목록 — 라이노의 명명된 뷰를 따르되 **2D 획을 소유한다**. */
    #views{position:absolute;right:10px;top:236px;z-index:3;min-width:15ch;max-width:30ch;
           background:rgba(255,255,255,.86);border:1px solid #e3e3e3;border-radius:8px;
           padding:6px 8px;line-height:1.5;backdrop-filter:blur(2px)}
    #views .cap{font-size:12px;color:#888;margin-bottom:3px}
    #views .row{display:flex;gap:6px;align-items:center}
    #views .row + .row{margin-top:2px}
    #views .row button{font:inherit;font-size:13px;padding:2px 7px;border:1px solid #d4d4d4;
                       border-radius:5px;background:#fff;color:#111;cursor:pointer;
                       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
    #views .row button.on{background:#111;color:#fff;border-color:#111}
    #views .row .del{flex:0 0 auto;color:#c0392b;padding:2px 6px}
    #views .row .ren{flex:0 0 auto;color:#888;padding:2px 6px}
    #views .row .del:disabled{opacity:.3;cursor:default;color:#888}
    #views .n{color:#888;font-size:12px}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="frame">
      <div id="stage"></div>
      <canvas id="ink"></canvas>
      <div id="status"></div>
      <div id="tools"></div>
  <div id="side" class="hidden"></div>
  <canvas id="cube" width="108" height="108"></canvas>
  <div id="views"></div>
    </div>
    <div id="bar"></div>
  </div>
  <script type="module" src="./src/mainL.ts"></script>
</body>
</html>
